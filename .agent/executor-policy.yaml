version: 1
repository: arvectum2/proxy-launcher
mode: roadmap_executor

sources:
  current_task: .agent/current-task.yaml
  execution_queue: .agent/execution-queue.yaml
  supporting_roadmap:
    - docs/LOCAL_EXECUTION_BACKLOG.md
    - GitHub issues and accepted repository evidence referenced by queue items

selection:
  resume_active_current_task_first: true
  scan_queue_in_order: true
  may_skip_blocked_or_human_gated_items: true
  may_execute_later_independent_items: true
  executor_may_reorder_queue: false
  executor_may_change_authority_class: false
  executor_may_create_new_priorities: false
  dependencies_must_be_satisfied: true

status_rules:
  executor_may_transition:
    - ready -> in_progress
    - in_progress -> blocked
    - blocked -> in_progress
    - in_progress -> done
  executor_must_not_change:
    - order
    - authority
    - dependencies
    - owner_gate
  done_requires_definition_of_done_and_evidence: true

lease:
  enabled: true
  ttl_minutes: 110
  renew_each_run: true
  reclaim_after_expiry_only_after_repository_activity_check: true
  manual_override_blocks_automation: true
  current_task_fields:
    - claimed_by
    - execution_id
    - branch
    - base_commit
    - lease_until
    - manual_override

authority:
  AUTO:
    description: "Low-risk, reversible repository work inside an already approved product scope."
    may:
      - inspect repository and issue state
      - create branches and pull requests
      - edit code, tests, documentation, CI and repository-owned evidence
      - run deterministic tests and diagnostics
      - commit and push changes
      - update issue/checkpoint evidence
      - merge only when the queue item explicitly permits auto_merge, required CI is green, no owner/review gate exists, and the change has no external or production effect
  REVIEW:
    description: "Executor may prepare a complete implementation and evidence, but an authorized human must pass the final gate."
    may:
      - perform AUTO preparation work
      - open or update a pull request
      - prepare decision packets and recommendations
    must_stop_before:
      - final architecture or product-scope decision
      - merge when the queue item requires human review
      - public release or external effect
  OWNER:
    description: "Reserved decision. Automation may prepare analysis/drafts only and may not represent the decision as approved."
  HUMAN:
    description: "Requires physical, credentialed, legal or otherwise non-delegated human action. Automation may prepare instructions/evidence only."

hard_stops:
  - publish or replace release assets
  - move immutable tags
  - sign binaries, legal documents or submissions with owner/company credentials
  - create payments, purchases or paid commitments
  - accept legal, security or commercial risk on behalf of the owner/company
  - expose or rotate secrets, private keys, УКЭП or private corporate evidence without explicit authorization
  - destructive or irreversible host/storage/boot changes without an explicit task-specific human gate
  - production infrastructure mutation not explicitly pre-authorized by a queue item
  - external supplier/customer/regulator communication

blocker_behavior:
  record_real_blocker: true
  release_lease_when_waiting_on_human: true
  continue_with_next_independent_ready_item: true
  notify_only_if_no_independent_executable_work_remains_or_owner_action_is_time_critical: true

notifications:
  notify_on:
    - completed roadmap item
    - owner or human decision required and no independent executable work remains
    - material safety/security/legal blocker
  suppress_routine_progress: true
