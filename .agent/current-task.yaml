definition_of_done:
  - New/Edit controls render complete rounded shapes/borders on the owner phone in both the normal and profile-menu-open screenshots.
  - New/Edit sizing and text adapt to screen width/height and font scale without wrapping or clipping.
  - The adaptive controls preserve at least a 48dp touch target and existing enable/disable behavior.
  - Previous accepted fixes (NoActionBar/Deep Navy, failover copy, app exclusions loading) remain unchanged.
  - Complete 8 documented cross-review passes covering rendering, responsive metrics, typography, touch targets, popup overlap, accessibility, regressions, and release validation.
  - Android lint/tests/build and APK checksum verification pass.
completed:
  - Captured physical-device feedback and screenshots for all three defects.
  - Enabled active named-profile editing while connected; saving triggers a live reconnect and delete stays disabled during the active edit.
  - Moved Sites / Apps / Journal into an always-visible quick-action row at the top of the profile menu.
  - Removed the AlertDialog message/list conflict so the installed-app multi-choice list is actually rendered.
  - Bumped Android physical-test candidate to 0.1.33 / versionCode 34 and updated the CI version guard.
  - Physical acceptance confirmed 0.1.33 functionally works.
  - Cross-review 1 UX/layout: distinct mint borders, asymmetric 0.8/1.4/0.8 widths, one-line autosizing labels.
  - Cross-review 2 async state: loading dialog is shown before installed-app discovery and PackageManager work runs off the UI thread.
  - Cross-review 3 lifecycle: loading dialog is tracked/dismissed onStop; stale background results cannot reopen UI after dismissal.
  - Cross-review 4 accessibility: 48dp action targets, focusable actions, one-line autosizing text, progress content description.
  - Cross-review 5 performance: deliberately avoided blur/render effects on old devices; only lightweight dialog dim + indeterminate progress.
  - Cross-review 6 cancellation/error handling: Cancel dismisses loader; stale result ignored; query failures/empty results show explicit error.
  - Cross-review 7 regression: connected-profile editing and app-exclusion persistence/live reconnect paths remain intact.
  - Cross-review 8 release validation: bumped candidate to 0.1.34 / versionCode 35 and aligned CI APK version guards.
  - Physical acceptance confirmed 0.1.34 UX polish works.
  - Cross-review 1 composition: New/Edit row now has explicit 58dp height with 48dp controls and bottom breathing room, preventing clipped rounded borders.
  - Cross-review 2 small-screen behavior: profile panel remains wrap-content while the power area flexes with weight, so the control panel retains its full geometry.
  - Cross-review 3 theme/system bar: Android 27+ AppTheme now explicitly inherits Theme.Material.Light.NoActionBar, sets windowNoTitle, and preserves Deep Navy window/status/navigation backgrounds.
  - Cross-review 4 visual hierarchy: existing Deep Navy / Graphite / Mint hierarchy remains consistent; no extra separator color or fake overlay introduced.
  - Cross-review 5 copy/semantics: user-facing "основной" failover terminology replaced with "приоритетный"; restore copy is "Возвращаться к приоритетному прокси после сбоя".
  - Cross-review 6 accessibility: New/Edit remain 48dp touch targets and no smaller controls were introduced.
  - Cross-review 7 regression: app exclusions async loader and connected-profile editing paths remain present and unchanged.
  - Cross-review 8 release validation: candidate bumped to 0.1.35 / versionCode 36 with matching CI version guards.
  - Physical acceptance confirmed 0.1.35 fixes #2 and #3; New/Edit frame clipping remains on the owner phone.
  - Cross-review 1 rendering: New/Edit no longer use framework Button widgets; both are custom TextView actions with explicit custom backgrounds.
  - Cross-review 2 responsive frame: narrow screens reduce panel horizontal padding, inter-button gap, and corner radius to reclaim width.
  - Cross-review 3 typography: labels use autosize with screen-width/fontScale-aware min/max SP and remain single-line.
  - Cross-review 4 accessibility: adaptive actions preserve a 48dp minimum touch target and explicit content descriptions.
  - Cross-review 5 short-screen spacing: only vertical whitespace contracts on short screens; the 48dp action target is preserved.
  - Cross-review 6 popup coexistence: profile panel/action containers disable child clipping and the profile popup remains anchored to the selector.
  - Cross-review 7 regression: NoActionBar/Deep Navy, revised failover copy, async app exclusions, and connected-profile editing remain intact.
  - Cross-review 8 release validation: added ResponsiveUiPolicy unit coverage and bumped candidate to 0.1.36 / versionCode 37 with matching CI guards.
