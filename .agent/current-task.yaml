resume_instruction: "Key release blocker: APL-SMART3-EGRESS-001 and physical device acceptance, not sensor. At source commit 471ace66, Rust 10 + Swift 126 + Python 17 + iOS app+UI Simulator PASS. Tun2proxy v0.8.3 patch and SmartFlowEventCollector bridge real per-host TCP CONNECT outcomes; iOS UI now suggests nonworking host with explicit approval but DOES NOT automatically DIRECT because Apple TN3120 and global shared IP excludedRoutes. Follow Apple-supported exact-host independent direct egress feasibility; only then connect AdaptiveRouteLearning.comparison to validated physical route. Fallback requires owner product decision before 0.2.0 release. Physical iPhone A→auth.A and same-CDN egress E2E still required. No off-scope Gateway/VPS, unsupported local listener, silent /32 changes, real user-device mutation, App Store upload/merge, privacy/ads or Watchdog. Docs: docs/APL_SMART_ADAPTIVE_ROUTING_2026-11-02.md and ROADMAP."
