goal: "Finish the remaining APL-MOB-002 Android proxy-pool scope after the accepted 0.1.13 release: continuous health monitoring of the active upstream, automatic failover with anti-flapping protection, health/latency visibility, primary/backup policy and restore behavior, credential-safe event logging, and resilient recovery across connectivity transitions."
authority: HUMAN
definition_of_done:
  - "Accepted Android 0.1.13 baseline remains intact: one-button UX, multiprofile secure storage, manual hot-switch and connect-time Auto continue to work."
  - "Saved proxies expose bounded health state (checking/available/unavailable) and measured connect latency without treating lowest latency as guaranteed throughput."
  - "Pool has a documented primary/backup ordering or equivalent explicit primary designation and one or more fallback candidates."
  - "While connected in pool Auto mode, confirmed active-upstream failure triggers automatic failover to a working fallback without another Android VPN permission prompt."
  - "Transient packet loss does not cause endless switching: failure debounce plus cooldown/hysteresis are enforced and covered by tests."
  - "Restore behavior after primary recovery is explicit and persisted: stay on current fallback or return to primary according to policy."
  - "When no candidate is working, UI/service exposes an unambiguous disconnected/degraded state and does not leave an unclear network state."
  - "Failover monitoring survives or cleanly restarts after sleep/wake and network changes (Wi-Fi/cellular) without leaking credentials."
  - "A minimal credential-free event log records unavailable/switch/restored decisions."
  - "Relevant unit/integration tests pass locally; exact-head Android CI and repository required checks pass on the implementation PR."
  - "Physical Android acceptance confirms active-proxy kill -> automatic fallback -> internet recovery and no repeated VPN permission prompt."
