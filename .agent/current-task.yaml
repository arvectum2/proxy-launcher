goal: Deliver automatic failed-domain no-proxy recovery for Safari without user interaction, exact hostname only,
  no shared-IP leakage, suitable for consumer iOS 0.2.0. No intermediate App Store release.
definition_of_done:
- 'Automatic trigger: two distinct attributable proxy timeouts/refusals while upstream healthy; independent physical
  DIRECT probe; two verified successes and bounded TTL stored locally; rollback on network change or failures.'
- Exact-host traffic DIRECT and unrelated host sharing same destination IP stays on upstream proxy; raw-IP/ECH/QUIC/DoH
  unsupported flows fail closed without data leak.
- Demonstrate safe and functional consumer iOS behavior with tests. The user explicitly delegates admissibility to
  Apple App Review rather than requiring pre-clearance by Apple DTS; record any relevant technical risk without claiming
  App Review approval.
- Implement route switching in pinned tun2proxy and Swift policy, test cargo + Swift Core + iPhone physical egress
  + shared-IP adversarial cases; no user profile/proxy modification.
- Do not merge, publish, or upload iOS 0.2.0 until full end-to-end behavior verified; checkpoint accurately records
  status.
