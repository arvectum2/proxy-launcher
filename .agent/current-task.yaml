resume_instruction: "On the test laptop, in the RED OS rescue shell, run `sync && poweroff`. After the laptop fully powers off, remove the RED OS USB and boot normally into Astra. Once Astra is up, verify `findmnt /`, `df -hT /`, `lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINTS,PARTUUID`, `parted -s /dev/nvme0n1 unit GiB print free`, and `efibootmgr`. If Astra boots and all geometry/UEFI checks are sane, mark the preparation phase complete and proceed to RED OS installation planning using only the 70 GiB free interval between p5 and p4. Never modify p1/p2/p3/p4."
