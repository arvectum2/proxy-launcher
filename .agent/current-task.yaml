current: "Second test-mode lifecycle run reached the real product Driver Store install path and exposed a production helper defect: Windows PowerShell 5.1 Start-Process -ArgumentList @($Operation,$InfPath) flattened the INF path under C:\\Program Files into multiple argv entries, so ArvectumDriverPackageTool returned usage/exit 87 before DiInstallDriverW. Product fix replaces Start-Process with direct PowerShell invocation `& $Tool $Operation $InfPath` plus redirected stdout/stderr and `$LASTEXITCODE`, preserving a spaced INF path as one argv entry. Added regression assertions preventing reintroduction of the unsafe Start-Process form. PowerShell 5.1 parse PASS, git diff --check PASS, focused suite 69/69 PASS and full production/native-stack suite 111/111 PASS. Protective VM cleanup removed services/state after the failed install attempt. Next: commit/push, hosted Windows CI on exact fix commit, then rerun disposable-VM lifecycle acceptance."
