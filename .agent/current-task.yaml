goal: "Implement a truthful production distribution lifecycle for the Windows WFP kernel driver and privileged routing service, including installer elevation, Microsoft-trusted driver packaging, rollback, upgrade/uninstall, and CI gates."
definition_of_done:
  - "Document current Microsoft production signing path from first-party guidance."
  - "Define release artifact contract for driver/service/package metadata and separate test-signed from production-signed payloads."
  - "Implement installer/native-stack lifecycle with explicit elevation, deterministic install/upgrade/uninstall/rollback, and no production testsigning mutation."
  - "Use a Driver Store primitive driver package (INF/CAT/SYS) rather than copying the production kernel driver manually."
  - "Fail closed unless production CAT has Microsoft Windows Hardware Compatibility Publisher signature and native user-mode binaries have expected Authenticode publisher."
  - "Add deterministic tests and hosted Windows CI for package/lifecycle validation."
  - "Run locally available tests, diff checks, hosted CI, and real Windows validation where feasible."
  - "Keep live_enforcement_supported false unless the actually installed stack is production-signed and verified."
