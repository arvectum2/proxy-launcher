  idempotent.
- Regression tests cover saved/applied mixed states, inverse mixed states, foreign
  PAC/manual proxy, env conflicts, and retry-safe recovery.
- Relevant Windows/backend/release tests and exact-head CI pass.
- Physical ARVECTUM-DEMO Windows acceptance covers start -> manual Arvectum proxy
  disable/partial change -> stop/restart plus foreign proxy preservation.
- Immutable v0.2.9 is published to GitHub and GitVerse; exact public Windows installer/portable
  artifacts are verified and installed/tested on ARVECTUM-DEMO.
- Canonical checkpoint is completed and merged to main.
