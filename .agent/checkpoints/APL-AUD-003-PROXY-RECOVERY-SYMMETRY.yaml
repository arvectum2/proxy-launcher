goal: Audit whether the user-reported external proxy change -> stop/restart/recovery scenario is handled symmetrically
  on Windows, Astra Linux and RED OS.
authority: HUMAN
definition_of_done:
- Compare ownership/recovery semantics for Windows, Astra Linux (GSettings/Fly) and RED OS (KDE) on current main.
- Identify whether external partial proxy changes while launcher is active can strand recovery on each platform.
- Verify automated regression coverage for the scenario on each platform and run relevant tests.
- Document any asymmetry and, if a correctness gap is found, leave a precise implementation recommendation or continue
  with a fix.
completed:
- Confirmed Astra/Fly and RED OS share LinuxBackend recovery semantics; mixed desktop recovery is backend-agnostic
  across gsettings and KDE.
- Confirmed the 0.2.8 mixed-state regression tests default to backend_id=gsettings (Astra/Fly path) and separate
  KDE identity/restore tests cover RED OS backend selection.
- 'Explicit same-scenario harness passed for both gsettings and kde: pending evidence -> disable succeeds -> exact
  original desktop state -> pending cleared.'
- 'Focused backend/recovery suite passed: 60/60 tests.'
- Windows simple external disable is operationally recoverable because valid backup is restored on stop and preserved
  for restart; it should not reproduce the RED OS 0.2.7 stranded-recovery failure.
- 'Found Windows ownership asymmetry: WinINET and proxy-env restore do not inspect current state before replaying
  the saved backup. A foreign PAC/manual proxy or proxy environment set while Arvectum is active can therefore be
  overwritten on stop.'
- Confirmed there is no Windows regression test for external partial/current proxy changes analogous to Linux mixed-state
  tests; existing foreign-proxy tests cover orphan cleanup/recovery ownership, not active-backup rollback conflict.
- This behavior is not fully aligned with backend_contract FOREIGN-001 (foreign/admin-managed proxy state must not
  be silently replaced or destroyed).
current: 'Audit completed: Astra and RED OS are symmetric for the reported mixed desktop-proxy recovery scenario;
  Windows is operationally tolerant of manual Arvectum-PAC disable but not ownership-symmetric for newer foreign
  proxy changes.'
