name: ArvectumProxyLauncherIOS
options:
  bundleIdPrefix: ru.arvectum.proxylauncher
  deploymentTarget:
    iOS: "15.0"
packages:
  YandexMobileAds:
    url: https://github.com/yandexmobile/yandex-ads-sdk-ios
    from: "8.6.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "48"
    DEVELOPMENT_TEAM: "VML75VY94V"
    CODE_SIGN_STYLE: Automatic
targets:
  ArvectumProxyLauncher:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - SharedCore
      - path: Resources
        buildPhase: resources
      - path: Config/AppPrivacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: PacketTunnel
        embed: true
      - package: YandexMobileAds
        product: YandexMobileAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.proxylauncher.ios
        PRODUCT_NAME: "Arvectum Proxy Launcher"
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: "APL Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "APL App Store"
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - PacketTunnel
      - Shared
      - SharedCore
      - path: Config/PacketTunnelPrivacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - framework: Frameworks/tun2proxy.xcframework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.proxylauncher.ios.PacketTunnel
        PRODUCT_NAME: "Arvectum Packet Tunnel"
        INFOPLIST_FILE: Config/PacketTunnel-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/PacketTunnel.entitlements
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: "APL Packet Tunnel Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "APL Packet Tunnel App Store"
  SmartExclusionsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UITests
      # Compile the exact production probe (not a duplicate implementation)
      # into hardware QA runner for hermetic TCP protocol tests on loopback.
      - Shared/ProxyProbe.swift
      - SharedCore/ProxyModel.swift
      - SharedCore/ProxyFailureReason.swift
      - SharedCore/ProxyImport.swift
      - SharedCore/ProxyImportStructured.swift
    dependencies:
      - target: ArvectumProxyLauncher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.proxylauncher.ios.UITests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: YES
schemes:
  ArvectumProxyLauncher:
    build:
      targets:
        ArvectumProxyLauncher: all
        PacketTunnel: all
    test:
      config: Debug
      targets:
        - SmartExclusionsUITests
    run:
      config: Debug
    archive:
      config: Release
