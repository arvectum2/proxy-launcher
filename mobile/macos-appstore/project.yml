name: ArvectumProxyLauncherMacAppStore
options:
  bundleIdPrefix: ru.arvectum.proxylauncher.macos
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.2.17"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "VML75VY94V"
    CODE_SIGN_STYLE: Manual
    SUPPORTS_MACCATALYST: YES
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
    MACCATALYST_DEPLOYMENT_TARGET: "12.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  ArvectumProxyLauncherMac:
    type: application
    platform: iOS
    sources:
      - App/ArvectumProxyLauncherMacApp.swift
      - App/HelpView.swift
      - ../ios/App/AppViewModel.swift
      - ../ios/App/ContentView.swift
      - App/VPNController.swift
      - App/PrivacyDisclosureView.swift
      - ../ios/Shared/ProfileStore.swift
      - ../ios/Shared/ProxyProbe.swift
      - ../ios/Shared/TelemetryStore.swift
      - Shared/AppShared.swift
      - ../ios/SharedCore
      - path: Resources
        buildPhase: resources
      - path: Config/AppPrivacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: PacketTunnelMac
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.proxylauncher.macos
        PRODUCT_NAME: "Arvectum Proxy Launcher"
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: "APL Mac Development"
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "APL Mac App Store"
  PacketTunnelMac:
    type: app-extension
    platform: iOS
    sources:
      - ../ios/PacketTunnel
      - ../ios/Shared/ProfileStore.swift
      - ../ios/Shared/ProxyProbe.swift
      - ../ios/Shared/TelemetryStore.swift
      - Shared/AppShared.swift
      - ../ios/SharedCore
      - path: Config/PacketTunnelPrivacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - framework: Frameworks/tun2proxy.xcframework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.arvectum.proxylauncher.macos.PacketTunnel
        PRODUCT_NAME: "Arvectum Packet Tunnel"
        INFOPLIST_FILE: Config/PacketTunnel-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/PacketTunnel.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: "APL Mac Packet Tunnel Development"
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "APL Mac Packet Tunnel App Store"
schemes:
  ArvectumProxyLauncherMac:
    build:
      targets:
        ArvectumProxyLauncherMac: all
        PacketTunnelMac: all
    run:
      config: Debug
    archive:
      config: Release
