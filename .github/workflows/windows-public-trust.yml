name: APL-REL-016 Windows public trust

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'fix/**'
      - 'feature/**'
    paths:
      - '.github/workflows/windows-public-trust.yml'
      - '.github/workflows/windows-authenticode.yml'
      - 'release/APL_REL_016_WINDOWS_PUBLIC_TRUST.md'
      - 'release/APL_REL_016_WINDOWS_PUBLIC_TRUST_CONTRACT.json'
      - 'tools/windows_authenticode.ps1'
      - 'tools/windows_public_trust_gate.ps1'
      - 'tools/package_signed_windows_portable.ps1'
      - 'tools/windows_promoted_license_compliance.ps1'
      - 'tools/build_windows_installer.ps1'
      - 'tests/test_windows_public_trust.py'
      - 'tests/test_windows_authenticode_foundation.py'
  pull_request:
    branches:
      - main
      - 'release/**'
    paths:
      - '.github/workflows/windows-public-trust.yml'
      - '.github/workflows/windows-authenticode.yml'
      - 'release/APL_REL_016_WINDOWS_PUBLIC_TRUST.md'
      - 'release/APL_REL_016_WINDOWS_PUBLIC_TRUST_CONTRACT.json'
      - 'tools/windows_authenticode.ps1'
      - 'tools/windows_public_trust_gate.ps1'
      - 'tools/package_signed_windows_portable.ps1'
      - 'tools/windows_promoted_license_compliance.ps1'
      - 'tools/build_windows_installer.ps1'
      - 'tests/test_windows_public_trust.py'
      - 'tests/test_windows_authenticode_foundation.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: REL-016 contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Validate Windows public trust contract
        run: python -m unittest tests.test_windows_public_trust -v

  powershell-syntax:
    name: REL-016 PowerShell syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse public-trust scripts
        shell: pwsh
        run: |
          $files = @(
            '.\tools\windows_authenticode.ps1',
            '.\tools\windows_public_trust_gate.ps1',
            '.\tools\package_signed_windows_portable.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "${file}: $($_.Message)" }
              throw "$file has $($errors.Count) PowerShell parse error(s)."
            }
            Write-Host "PowerShell parse PASS: $file"
          }

      - name: Assert production secrets are not embedded in REL-016 sources
        shell: pwsh
        run: |
          $text = Get-Content -Raw '.\tools\package_signed_windows_portable.ps1', '.\tools\windows_public_trust_gate.ps1'
          if ($text -match '(?i)\.pfx\b|\.p12\b|pfx_password|certificatepassword') {
            throw 'REL-016 source unexpectedly references exportable certificate/private-key secret material.'
          }
          Write-Host 'REL-016 secret-boundary scan PASS.'

  ephemeral-signed-byte-order:
    name: REL-016 signed app -> portable -> installer smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Install pinned Inno Setup 6.7.1
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Build canonical unsigned baseline
        shell: pwsh
        run: ./tools/clean_build_windows.ps1 -PythonExecutable python

      - name: Create ephemeral RSA-3072 code-signing identity
        id: test_cert
        shell: pwsh
        run: |
          $subject = 'CN=Arvectum REL016 CI Authenticode Test'
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -KeyAlgorithm RSA `
            -KeyLength 3072 `
            -Subject $subject `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -NotAfter (Get-Date).AddDays(1)
          $cerPath = Join-Path $env:RUNNER_TEMP 'arvectum-rel016-ci.cer'
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
          Import-Certificate -FilePath $cerPath -CertStoreLocation 'Cert:\LocalMachine\Root' | Out-Null
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          "subject=$($cert.Subject)" >> $env:GITHUB_OUTPUT

      - name: Sign application before packaging
        shell: pwsh
        run: |
          ./tools/windows_authenticode.ps1 `
            -Mode Sign `
            -Path 'dist\Arvectum Proxy Launcher.exe' `
            -CertificateThumbprint '${{ steps.test_cert.outputs.thumbprint }}' `
            -ExpectedPublisher '${{ steps.test_cert.outputs.subject }}' `
            -SkipTimestamp

      - name: Rebuild portable around exact signed application
        id: signed_portable
        shell: pwsh
        run: |
          ./tools/package_signed_windows_portable.ps1 `
            -SignedApplication 'dist\Arvectum Proxy Launcher.exe' `
            -BuildResultPath 'out\build-result.json' `
            -ExpectedPublisher '${{ steps.test_cert.outputs.subject }}' `
            -ExpectedThumbprint '${{ steps.test_cert.outputs.thumbprint }}'

      - name: Build installer from exact signed application bytes
        id: signed_installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $portable = "out\public-signed\Arvectum-Proxy-Launcher-$version-windows-x64-portable.zip"
          $appHash = (Get-FileHash -LiteralPath 'dist\Arvectum Proxy Launcher.exe' -Algorithm SHA256).Hash
          ./tools/build_windows_installer.ps1 `
            -UseExistingPayload `
            -ApplicationExe 'dist\Arvectum Proxy Launcher.exe' `
            -PortableZip $portable `
            -BuildResultPath 'out\public-signed\build-result.json' `
            -ExpectedApplicationSha256 $appHash

      - name: Sign and verify final installer after compilation
        shell: pwsh
        run: |
          $setup = Get-ChildItem -LiteralPath 'out\installer' -Filter '*-windows-x64-setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'REL-016 smoke did not produce Setup.' }
          ./tools/windows_authenticode.ps1 `
            -Mode Sign `
            -Path $setup.FullName `
            -CertificateThumbprint '${{ steps.test_cert.outputs.thumbprint }}' `
            -ExpectedPublisher '${{ steps.test_cert.outputs.subject }}' `
            -SkipTimestamp
          ./tools/windows_authenticode.ps1 `
            -Mode Verify `
            -Path 'dist\Arvectum Proxy Launcher.exe' `
            -ExpectedPublisher '${{ steps.test_cert.outputs.subject }}'
          ./tools/windows_authenticode.ps1 `
            -Mode Verify `
            -Path $setup.FullName `
            -ExpectedPublisher '${{ steps.test_cert.outputs.subject }}'
          Write-Host 'APL-REL-016 ephemeral byte-order smoke PASS.'

      - name: Remove ephemeral CI certificate
        if: always()
        shell: pwsh
        run: |
          $thumbprint = '${{ steps.test_cert.outputs.thumbprint }}'
          if ($thumbprint) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath "Cert:\LocalMachine\Root\$thumbprint" -Force -ErrorAction SilentlyContinue
          }
