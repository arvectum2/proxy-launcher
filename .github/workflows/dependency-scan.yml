name: Dependency vulnerability scan

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up build Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: BUILD_PYTHON_VERSION
          cache: pip
          cache-dependency-path: requirements-build.lock.txt

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check --no-cache-dir pip-audit==2.10.1

      - name: Audit locked build dependencies
        run: python -m pip_audit --strict --requirement requirements-build.lock.txt --progress-spinner off
