name: Mobile Android spike

on:
  pull_request:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/mobile-android-spike.yml'
  push:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/mobile-android-spike.yml'

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch pinned tun2proxy native libraries
        run: python3 mobile/android/tools/fetch_tun2proxy.py
      - name: Verify public Android source excludes friend gateway
        shell: bash
        run: |
          test ! -e mobile/android/app/src/main/java/ru/arvectum/proxylauncher/gateway/FreeGatewayClient.kt
          test ! -e mobile/android/app/src/main/java/ru/arvectum/proxylauncher/tunnel/FreeTunnelRecoveryPolicy.kt
          ! grep -R -n -E 'FreeGatewayClient|FreeTunnelRecoveryPolicy|/v1/free/|[Бб]есплатн' mobile/android/app/src/main
      - name: Verify stable dogfood signing key
        shell: bash
        run: |
          actual="$(keytool -list -v             -keystore mobile/android/signing/proxy-launcher-dogfood.keystore             -storepass android             -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          expected="FD:57:CD:46:AD:1E:54:A1:53:AA:9E:D5:6B:4B:BB:63:0B:33:01:5E:23:D4:C6:A8:60:77:A6:7C:F0:E2:83:13"
          test "$actual" = "$expected" || {
            echo "Dogfood signer mismatch: $actual" >&2
            exit 1
          }
      - name: Android lint
        run: gradle -p mobile/android lintPublicDebug lintPrivateDebug --stacktrace
      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-launcher-android-lint
          path: |
            mobile/android/app/build/reports/lint-results-*.html
            mobile/android/app/build/intermediates/lint_intermediate_text_report/**/lint-results-*.txt
          if-no-files-found: warn
      - name: Test and assemble debug APK
        run: gradle -p mobile/android testPublicDebugUnitTest testPrivateDebugUnitTest assemblePublicDebug assemblePrivateDebug --stacktrace
      - name: Verify assembled APK signer and branding
        shell: bash
        run: |
          public_apk="mobile/android/app/build/outputs/apk/public/debug/app-public-debug.apk"
          private_apk="mobile/android/app/build/outputs/apk/private/debug/app-private-debug.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          for apk in "$public_apk" "$private_apk"; do
            "$apksigner" verify --print-certs "$apk" | tee /tmp/apk-signing.txt
            grep -Fqi "certificate SHA-256 digest: fd57cd46ad1e54a153aa9ed56b4bbb630b33015e23d4c6a86077a67cf0e28313" /tmp/apk-signing.txt
          done
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt"
          "$aapt" dump badging "$public_apk" | tee /tmp/public-badging.txt
          grep -F "package: name='ru.arvectum.proxylauncher'" /tmp/public-badging.txt
          grep -F "versionCode='39'" /tmp/public-badging.txt
          grep -F "versionName='0.1.38'" /tmp/public-badging.txt
          "$aapt" dump badging "$private_apk" | tee /tmp/private-badging.txt
          grep -F "package: name='ru.arvectum.proxylauncher.private'" /tmp/private-badging.txt
          grep -F "versionCode='39'" /tmp/private-badging.txt
          grep -F "versionName='0.1.38-private'" /tmp/private-badging.txt
          unzip -l "$public_apk" | grep -F "res/drawable-nodpi-v4/arvectum_launcher_foreground.png"
          unzip -l "$public_apk" | grep -F "res/drawable-nodpi-v4/arvectum_mark.png"
          unzip -l "$private_apk" | grep -F "res/mipmap-anydpi-v26/arvectum_launcher.xml"
          gradle -p mobile/android :app:dependencies --configuration publicDebugRuntimeClasspath > /tmp/public-deps.txt
          gradle -p mobile/android :app:dependencies --configuration privateDebugRuntimeClasspath > /tmp/private-deps.txt
          grep -F "com.yandex.android:mobileads:8.5.0" /tmp/public-deps.txt
          if grep -F "com.yandex.android:mobileads" /tmp/private-deps.txt; then
            echo "Private flavor unexpectedly contains Yandex Mobile Ads" >&2
            exit 1
          fi
      - name: Record APK SHA-256
        run: sha256sum mobile/android/app/build/outputs/apk/public/debug/app-public-debug.apk mobile/android/app/build/outputs/apk/private/debug/app-private-debug.apk | tee mobile/android/app/build/outputs/apk/SHA256SUMS.txt
      - name: Upload dogfood APK
        uses: actions/upload-artifact@v4
        with:
          name: proxy-launcher-android-debug
          path: |
            mobile/android/app/build/outputs/apk/public/debug/app-public-debug.apk
            mobile/android/app/build/outputs/apk/private/debug/app-private-debug.apk
            mobile/android/app/build/outputs/apk/SHA256SUMS.txt
          if-no-files-found: error
