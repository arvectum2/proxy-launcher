name: Mobile Android spike

on:
  pull_request:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/mobile-android-spike.yml'
  push:
    branches:
      - apl-mob-001-android-spike
    paths:
      - 'mobile/android/**'
      - '.github/workflows/mobile-android-spike.yml'

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch pinned tun2proxy native libraries
        run: python3 mobile/android/tools/fetch_tun2proxy.py
      - name: Assemble debug APK
        run: gradle -p mobile/android assembleDebug --stacktrace
      - name: Record APK SHA-256
        run: sha256sum mobile/android/app/build/outputs/apk/debug/app-debug.apk | tee mobile/android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload dogfood APK
        uses: actions/upload-artifact@v4
        with:
          name: proxy-launcher-android-debug
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
