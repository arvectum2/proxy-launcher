name: Mobile Android spike

on:
  pull_request:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/mobile-android-spike.yml'
  push:
    branches:
      - apl-mob-001-android-spike
    paths:
      - 'mobile/android/**'
      - '.github/workflows/mobile-android-spike.yml'

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle -p mobile/android assembleDebug --stacktrace
