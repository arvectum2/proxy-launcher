name: Mobile Android spike

on:
  pull_request:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/mobile-android-spike.yml'
  push:
    branches:
      - apl-mob-001-android-spike
    paths:
      - 'mobile/android/**'
      - '.github/workflows/mobile-android-spike.yml'

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch pinned tun2proxy native libraries
        run: python3 mobile/android/tools/fetch_tun2proxy.py
      - name: Verify stable dogfood signing key
        shell: bash
        run: |
          actual="$(keytool -list -v             -keystore mobile/android/signing/proxy-launcher-dogfood.keystore             -storepass android             -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          expected="FD:57:CD:46:AD:1E:54:A1:53:AA:9E:D5:6B:4B:BB:63:0B:33:01:5E:23:D4:C6:A8:60:77:A6:7C:F0:E2:83:13"
          test "$actual" = "$expected" || {
            echo "Dogfood signer mismatch: $actual" >&2
            exit 1
          }
      - name: Test and assemble debug APK
        run: gradle -p mobile/android testDebugUnitTest assembleDebug --stacktrace
      - name: Verify assembled APK signer and branding
        shell: bash
        run: |
          apk="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --print-certs "$apk" | tee /tmp/apk-signing.txt
          grep -Fqi "certificate SHA-256 digest: fd57cd46ad1e54a153aa9ed56b4bbb630b33015e23d4c6a86077a67cf0e28313" /tmp/apk-signing.txt
          unzip -l "$apk" | grep -F "res/drawable-nodpi-v4/arvectum_launcher_foreground.png"
          unzip -l "$apk" | grep -F "res/drawable-nodpi-v4/arvectum_mark.png"
          unzip -l "$apk" | grep -F "res/mipmap-anydpi-v26/arvectum_launcher.xml"
          unzip -l "$apk" | grep -F "res/mipmap-anydpi-v26/arvectum_launcher_round.xml"
      - name: Record APK SHA-256
        run: sha256sum mobile/android/app/build/outputs/apk/debug/app-debug.apk | tee mobile/android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload dogfood APK
        uses: actions/upload-artifact@v4
        with:
          name: proxy-launcher-android-debug
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
