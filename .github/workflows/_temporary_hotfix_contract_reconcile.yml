name: Temporary 0.2.5 contract reconciliation

on:
  push:
    branches:
      - hotfix/0.2.5-cfa-installer-recovery

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[hotfix-contracts-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/0.2.5-cfa-installer-recovery
          fetch-depth: 0

      - name: Reconcile exact stale contracts
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "tests/test_proxy_core.py": [
                  (
                      'def test_paths_keep_documents_executable_and_localappdata_state_with_cyrillic_user(self):',
                      'def test_paths_keep_localappdata_executable_and_state_with_cyrillic_user(self):',
                  ),
                  (
                      'self.assertEqual(core.stable_app_exe(), home + r"\\Documents\\ArvectumProxyLauncher\\Arvectum Proxy Launcher.exe")',
                      'self.assertEqual(core.stable_app_exe(), local + r"\\Programs\\ArvectumProxyLauncher\\Arvectum Proxy Launcher.exe")',
                  ),
              ],
              "tests/test_windows_maintenance_flow.py": [
                  (
                      'self.assertIn("transactional application replacement rolled back", helper)',
                      'self.assertIn("transactional replacement rolled back", helper)',
                  ),
              ],
              "tests/test_windows_productization.py": [
                  (
                      'self.assertIn("arvectum.proxy.windows-rc-e2e.v1", script)',
                      'self.assertIn("arvectum.proxy.windows-rc-e2e.v2", script)',
                  ),
              ],
          }

          old_release_test = '''    @unittest.skipUnless(HAS_INSTALLER_TRACK, "installer track is not present in portable P0 branch")
              def test_verified_payload_placement_is_in_primary_files_phase(self):
                  text = self.read("installer/ArvectumProxyLauncher.iss")
                  self.assertIn("AfterInstall: InstallVerifiedPayload", text)
                  install = text[text.index("procedure InstallVerifiedPayload"):text.index("procedure CurStepChanged")]
                  post_install = text[text.index("procedure CurStepChanged"):]
                  self.assertIn("RunEmbeddedHelper('upgrade_helper.ps1'", install)
                  self.assertIn("RaiseException(ErrorText)", install)
                  self.assertNotIn("RunEmbeddedHelper('upgrade_helper.ps1'", post_install)
          '''.replace("              ", "")

          new_release_test = '''    @unittest.skipUnless(HAS_INSTALLER_TRACK, "installer track is not present in portable P0 branch")
              def test_verified_payload_handover_is_deferred_until_postinstall(self):
                  text = self.read("installer/ArvectumProxyLauncher.iss")
                  self.assertNotIn("AfterInstall: InstallVerifiedPayload", text)
                  install = text[text.index("procedure InstallVerifiedPayload"):text.index("procedure CacheRepairInstaller")]
                  post_install = text[text.index("procedure CurStepChanged"):text.index("function RunInstalledUninstallHelper")]
                  self.assertIn("RunEmbeddedHelper('upgrade_helper.ps1'", install)
                  self.assertIn("RaiseException(ErrorText)", install)
                  self.assertIn("if CurStep = ssPostInstall", post_install)
                  self.assertIn("CacheRepairInstaller();", post_install)
                  self.assertIn("InstallVerifiedPayload();", post_install)
                  self.assertLess(post_install.index("CacheRepairInstaller();"), post_install.index("InstallVerifiedPayload();"))
                  self.assertNotIn("RunEmbeddedHelper('upgrade_helper.ps1'", post_install)
          '''.replace("              ", "")

          release_path = Path("tests/test_release_scripts.py")
          release_text = release_path.read_text(encoding="utf-8")
          if release_text.count(old_release_test) != 1:
              raise SystemExit("expected exactly one stale release-script test block")
          release_path.write_text(release_text.replace(old_release_test, new_release_test), encoding="utf-8")

          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f"{name}: expected exactly one occurrence of {old!r}, found {text.count(old)}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/_temporary_hotfix_contract_reconcile.yml")
          if not workflow.is_file():
              raise SystemExit("temporary workflow file missing")
          workflow.unlink()

      - name: Commit reconciled contracts and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "arvectum2"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_proxy_core.py tests/test_release_scripts.py tests/test_windows_maintenance_flow.py tests/test_windows_productization.py .github/workflows/_temporary_hotfix_contract_reconcile.yml
          git diff --cached --check
          git commit -m "QA: reconcile 0.2.5 LocalAppData handover contracts [hotfix-contracts-applied]"
          git push origin HEAD:hotfix/0.2.5-cfa-installer-recovery
