name: GitVerse v0.2.5 recovery mirror

on:
  push:
    branches:
      - ops/gitverse-native-release-v025
    paths:
      - .github/workflows/gitverse-release-v025-recovery.yml

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Download and verify exact GitHub v0.2.5 payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sync-assets
          gh release download v0.2.5 --repo "$GITHUB_REPOSITORY" --dir .sync-assets
          test "$(find .sync-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = '9'
          (
            cd .sync-assets
            sha256sum -c ../docs/releases/0.2.5-public-assets.sha256
          )

      - name: Verify GitVerse release metadata
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITVERSE_TOKEN"
          test -n "$GITVERSE_REPOSITORY"

          API='https://api.gitverse.ru'
          OWNER='arvectum'
          REPO="$GITVERSE_REPOSITORY"
          ACCEPT='application/vnd.gitverse.object+json;version=1'
          AUTH="Authorization: Bearer $GITVERSE_TOKEN"

          status="$(curl -sS -o .gitverse-release.json -w '%{http_code}' \
            -H "$AUTH" -H "Accept: $ACCEPT" \
            "$API/repos/$OWNER/$REPO/releases/tags/v0.2.5")"
          test "$status" = '200' || {
            echo "::error::GitVerse v0.2.5 release lookup failed HTTP $status"
            cat .gitverse-release.json || true
            exit 1
          }

          jq -e '.tag_name == "v0.2.5"' .gitverse-release.json >/dev/null
          jq -e '.name == "Arvectum Proxy Launcher 0.2.5"' .gitverse-release.json >/dev/null
          jq -e '(.draft == false) and (.prerelease == false)' .gitverse-release.json >/dev/null
          jq -j '.body // ""' .gitverse-release.json > .gitverse-release-notes.md
          cmp -s docs/releases/0.2.5.md .gitverse-release-notes.md || {
            echo '::error::GitVerse release notes differ from canonical 0.2.5 notes'
            exit 1
          }

          release_id="$(jq -r '.id' .gitverse-release.json)"
          test -n "$release_id" && test "$release_id" != 'null'
          echo "release_id=$release_id" >> "$GITHUB_ENV"
          echo "gitverse_repo=$REPO" >> "$GITHUB_ENV"
          echo "PASS GitVerse release metadata id=$release_id"

      - name: Upload exact assets with official GitVerse release client
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITVERSE_REPOSITORY" = 'proxy-launcher'

          git clone --depth 1 https://gitverse.ru/actions/create-release.git .gitverse-release-action
          mkdir -p .gitverse-release-action/cmd/arvectum-upload

          cat > .gitverse-release-action/cmd/arvectum-upload/main.go <<'GO'
          package main

          import (
              "fmt"
              "os"
              "strconv"

              "gitverse.ru/actions/create-release/internal/adapter/httpreleases"
              "gitverse.ru/actions/create-release/internal/client/gitverse"
              "gitverse.ru/actions/create-release/internal/service"
          )

          func main() {
              token := os.Getenv("GITVERSE_TOKEN")
              if token == "" {
                  panic("GITVERSE_TOKEN is missing")
              }
              if len(os.Args) < 3 {
                  panic("usage: arvectum-upload RELEASE_ID FILE...")
              }
              releaseID, err := strconv.ParseInt(os.Args[1], 10, 64)
              if err != nil {
                  panic(err)
              }
              files := os.Args[2:]
              if len(files) != 9 {
                  panic(fmt.Sprintf("expected exactly 9 assets, got %d", len(files)))
              }

              c, err := gitverse.New(gitverse.SetAccessToken(token))
              if err != nil {
                  panic(err)
              }
              repository := httpreleases.New(c)
              releases := service.New(repository)
              if err := releases.UploadFiles("arvectum", "proxy-launcher", releaseID, files); err != nil {
                  panic(err)
              }
              fmt.Printf("PASS official GitVerse client uploaded %d assets to release %d\n", len(files), releaseID)
          }
          GO

          mapfile -t asset_names < <(awk '{print $2}' docs/releases/0.2.5-public-assets.sha256)
          test "${#asset_names[@]}" = '9'
          asset_paths=()
          for name in "${asset_names[@]}"; do
            path="$GITHUB_WORKSPACE/.sync-assets/$name"
            test -f "$path"
            asset_paths+=("$path")
          done

          (
            cd .gitverse-release-action
            go run ./cmd/arvectum-upload "$release_id" "${asset_paths[@]}"
          )

      - name: Independently verify complete GitVerse release payload
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.gitverse.ru'
          OWNER='arvectum'
          REPO="$GITVERSE_REPOSITORY"
          ACCEPT='application/vnd.gitverse.object+json;version=1'
          AUTH="Authorization: Bearer $GITVERSE_TOKEN"

          curl -fsS -H "$AUTH" -H "Accept: $ACCEPT" \
            "$API/repos/$OWNER/$REPO/releases/$release_id/assets?per_page=50&page=1" \
            > .gitverse-assets-final.json

          awk '{print $2}' docs/releases/0.2.5-public-assets.sha256 | sort > .expected-names
          jq -r '.[].name' .gitverse-assets-final.json | sort > .actual-names
          diff -u .expected-names .actual-names
          test "$(wc -l < .actual-names | tr -d ' ')" = '9'

          while IFS= read -r expected_line; do
            [ -n "$expected_line" ] || continue
            expected_hash="${expected_line%% *}"
            name="${expected_line#*  }"
            url="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .browser_download_url' .gitverse-assets-final.json)"
            test -n "$url" && test "$url" != 'null'
            curl -LfsS -H "$AUTH" -H "Accept: $ACCEPT" "$url" -o .gitverse-verify-asset
            actual_hash="$(sha256sum .gitverse-verify-asset | awk '{print $1}')"
            test "$actual_hash" = "$expected_hash" || {
              echo "::error::Final GitVerse asset hash mismatch for $name: $actual_hash != $expected_hash"
              exit 1
            }
            echo "PASS final GitVerse asset: $expected_hash  $name"
          done < docs/releases/0.2.5-public-assets.sha256

          readme_status="$(curl -sS -o .gitverse-readme.json -w '%{http_code}' \
            -H "$AUTH" -H "Accept: $ACCEPT" \
            "$API/repos/$OWNER/$REPO/contents/README.md?ref=main")"
          test "$readme_status" = '200'
          jq -r '.content' .gitverse-readme.json | tr -d '\n' | base64 --decode > .gitverse-README.md
          cmp -s README.md .gitverse-README.md
          echo "PASS GitVerse README SHA-256: $(sha256sum README.md | awk '{print $1}')"

          echo 'GITVERSE RELEASE MIRROR: PASS'

      - name: Summary
        if: success()
        shell: bash
        run: |
          {
            echo '### GitVerse v0.2.5 recovery mirror PASS'
            echo "- GitVerse release id: ${release_id}"
            echo '- Release metadata matches canonical bilingual 0.2.5 notes.'
            echo '- GitVerse independently hosts exact copies of all 9 public release assets.'
            echo '- Every GitVerse asset was downloaded back and SHA-256 verified.'
            echo '- GitVerse README.md matches the canonical repository README.'
          } >> "$GITHUB_STEP_SUMMARY"
