name: Mirror published release to GitVerse

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub release tag to mirror (for recovery/re-verification)"
        required: true
        type: string

permissions:
  contents: read

env:
  GITVERSE_OWNER: arvectum

concurrency:
  group: gitverse-release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  mirror-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          test -n "$TAG"
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Invalid release tag: $TAG"; exit 1;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Validate mirror configuration
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITVERSE_TOKEN" || { echo "::error::GITVERSE_TOKEN is missing"; exit 1; }
          test -n "$GITVERSE_REPOSITORY" || { echo "::error::GITVERSE_REPO is missing"; exit 1; }

      - name: Download and verify canonical GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sync-assets .gitverse-transport
          mkdir -p .sync-assets .gitverse-transport
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,body,targetCommitish > .github-release.json
          test "$(jq -r '.tagName' .github-release.json)" = "$TAG"
          test "$(jq -r '.isDraft' .github-release.json)" = false
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir .sync-assets
          test -f .sync-assets/SHA256SUMS.txt
          manifest_count="$(grep -Ec '^[0-9a-fA-F]{64}  .+' .sync-assets/SHA256SUMS.txt)"
          asset_count="$(find .sync-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$manifest_count" -ge 1
          test "$asset_count" -eq "$((manifest_count + 1))"
          (cd .sync-assets && sha256sum -c SHA256SUMS.txt)

      - name: Build lossless GitVerse transport set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          source = Path('.sync-assets')
          out = Path('.gitverse-transport')
          # GitVerse release assets currently allow these extensions. Anything else
          # is carried losslessly in a deterministic single-file ZIP wrapper.
          direct_suffixes = (
              '.7z', '.apk', '.AppImage', '.cab', '.csv', '.doc', '.docx', '.dmg',
              '.gif', '.gz', '.jar', '.jpeg', '.jpg', '.js', '.log', '.md', '.odf',
              '.odg', '.odp', '.ods', '.odt', '.patch', '.pdf', '.png', '.pptx',
              '.svg', '.tgz', '.txt', '.webm', '.whl', '.xls', '.xlsx', '.zip',
          )
          rows = []
          for src in sorted(p for p in source.iterdir() if p.is_file()):
              original = src.name
              canonical_hash = hashlib.sha256(src.read_bytes()).hexdigest()
              if original.endswith(direct_suffixes):
                  transport, mode = original, 'direct'
                  (out / transport).write_bytes(src.read_bytes())
              else:
                  transport, mode = original + '.zip', 'wrapper'
                  info = zipfile.ZipInfo(original, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  with zipfile.ZipFile(out / transport, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                      zf.writestr(info, src.read_bytes())
              transport_hash = hashlib.sha256((out / transport).read_bytes()).hexdigest()
              rows.append((canonical_hash, original, transport, mode, transport_hash))
          if not rows or len({r[2] for r in rows}) != len(rows):
              raise SystemExit('GitVerse transport set is empty or contains duplicate names')
          Path('.gitverse-transport-map.tsv').write_text(
              ''.join('\t'.join(r) + '\n' for r in rows), encoding='utf-8')
          for row in rows:
              print('\t'.join(row))
          PY

      - name: Create or verify immutable GitVerse release
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.gitverse.ru'
          OWNER="$GITVERSE_OWNER"
          REPO="$GITVERSE_REPOSITORY"
          ACCEPT='application/vnd.gitverse.object+json;version=1'
          AUTH="Authorization: Bearer $GITVERSE_TOKEN"

          jq '{tag_name:.tagName,target_commitish:.targetCommitish,name:.name,body:.body,draft:false,prerelease:.isPrerelease,is_authorized_only:false}' \
            .github-release.json > .gitverse-release-body.json

          status="$(curl -sS -o .gitverse-release.json -w '%{http_code}' \
            -H "$AUTH" -H "Accept: $ACCEPT" "$API/repos/$OWNER/$REPO/releases/tags/$TAG")"
          if [ "$status" = 404 ]; then
            for attempt in $(seq 1 12); do
              create_status="$(curl -sS -o .gitverse-create.json -w '%{http_code}' -X POST \
                -H "$AUTH" -H "Accept: $ACCEPT" -H 'Content-Type: application/json' \
                "$API/repos/$OWNER/$REPO/releases" --data-binary @.gitverse-release-body.json)"
              if [ "$create_status" = 201 ]; then
                cp .gitverse-create.json .gitverse-release.json
                break
              fi
              if [ "$create_status" = 422 ]; then
                echo "::error::GitVerse rejected release creation with HTTP 422"
                cat .gitverse-create.json || true
                jq '{tag_name,name,target_commitish,draft,prerelease,is_authorized_only,body_length:(.body|length)}' .gitverse-release-body.json
                exit 1
              fi
              case "$create_status" in 401|403)
                echo "::error::GitVerse release creation unauthorized (HTTP $create_status)"; cat .gitverse-create.json; exit 1;;
              esac
              echo "GitVerse tag/release not ready yet ($attempt/12, HTTP $create_status); retrying"
              sleep 10
            done
          elif [ "$status" != 200 ]; then
            echo "::error::GitVerse release lookup failed HTTP=$status"; cat .gitverse-release.json || true; exit 1
          fi

          # If the create loop ended without a release, fetch once more before failing.
          if ! jq -e '.id' .gitverse-release.json >/dev/null 2>&1; then
            curl -fsS -H "$AUTH" -H "Accept: $ACCEPT" \
              "$API/repos/$OWNER/$REPO/releases/tags/$TAG" > .gitverse-release.json
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          desired=json.loads(Path('.gitverse-release-body.json').read_text())
          actual=json.loads(Path('.gitverse-release.json').read_text())
          for key in ('tag_name','name','body','draft','prerelease'):
              if actual.get(key) != desired.get(key):
                  raise SystemExit(f'GitVerse release metadata mismatch for {key}: {actual.get(key)!r} != {desired.get(key)!r}')
          print('PASS GitVerse release metadata')
          PY
          jq -r '.id' .gitverse-release.json > .gitverse-release-id
          jq -r '.upload_url' .gitverse-release.json > .gitverse-upload-url

      - name: Upload missing assets without mutating existing bytes
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.gitverse.ru'
          OWNER="$GITVERSE_OWNER"
          REPO="$GITVERSE_REPOSITORY"
          ACCEPT='application/vnd.gitverse.object+json;version=1'
          AUTH="Authorization: Bearer $GITVERSE_TOKEN"
          release_id="$(cat .gitverse-release-id)"
          upload_url="$(cat .gitverse-upload-url)"

          list_assets() {
            curl -fsS -H "$AUTH" -H "Accept: $ACCEPT" \
              "$API/repos/$OWNER/$REPO/releases/$release_id/assets?per_page=50&page=1"
          }
          list_assets > .gitverse-assets.json

          while IFS=$'\t' read -r canonical_hash original transport mode transport_hash; do
            count="$(jq --arg n "$transport" '[.[] | select(.name==$n)] | length' .gitverse-assets.json)"
            if [ "$count" -gt 1 ]; then
              echo "::error::Duplicate GitVerse asset: $transport"; exit 1
            fi
            if [ "$count" -eq 1 ]; then
              url="$(jq -r --arg n "$transport" '.[] | select(.name==$n) | .browser_download_url' .gitverse-assets.json)"
              curl -LfsS "$url" -o .gitverse-existing
              existing_hash="$(sha256sum .gitverse-existing | awk '{print $1}')"
              if [ "$existing_hash" != "$transport_hash" ]; then
                echo "::error::Immutable GitVerse asset differs: $transport"; exit 1
              fi
              echo "PASS existing immutable GitVerse asset: $transport"
              continue
            fi

            encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$transport")"
            case "$transport" in *.txt) mime='text/plain';; *.zip) mime='application/zip';; *) mime='application/octet-stream';; esac
            upload_status="$(curl -sS -o .gitverse-upload.json -w '%{http_code}' -X POST \
              "$upload_url?name=$encoded" -H "$AUTH" -H "Accept: $ACCEPT" \
              -F "attachment=@.gitverse-transport/$transport;filename=$transport;type=$mime")"
            if [ "$upload_status" != 201 ]; then
              echo "::error::GitVerse asset upload failed for $transport HTTP=$upload_status"
              cat .gitverse-upload.json || true
              exit 1
            fi
            echo "UPLOADED GitVerse asset: $transport"
            list_assets > .gitverse-assets.json
          done < .gitverse-transport-map.tsv

      - name: Verify public GitVerse payload parity
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.gitverse.ru'
          OWNER="$GITVERSE_OWNER"
          REPO="$GITVERSE_REPOSITORY"
          ACCEPT='application/vnd.gitverse.object+json;version=1'
          AUTH="Authorization: Bearer $GITVERSE_TOKEN"
          release_id="$(cat .gitverse-release-id)"
          curl -fsS -H "$AUTH" -H "Accept: $ACCEPT" \
            "$API/repos/$OWNER/$REPO/releases/$release_id/assets?per_page=50&page=1" > .gitverse-assets-final.json

          cut -f3 .gitverse-transport-map.tsv | sort > .expected-names
          jq -r '.[].name' .gitverse-assets-final.json | sort > .actual-names
          diff -u .expected-names .actual-names

          while IFS=$'\t' read -r canonical_hash original transport mode transport_hash; do
            url="$(jq -r --arg n "$transport" '.[] | select(.name==$n) | .browser_download_url' .gitverse-assets-final.json)"
            test -n "$url" && test "$url" != null
            curl -LfsS "$url" -o .gitverse-verified
            test "$(sha256sum .gitverse-verified | awk '{print $1}')" = "$transport_hash"
            if [ "$mode" = direct ]; then
              payload_hash="$transport_hash"
            else
              test "$(unzip -Z1 .gitverse-verified | wc -l | tr -d ' ')" = 1
              test "$(unzip -Z1 .gitverse-verified)" = "$original"
              unzip -p .gitverse-verified "$original" > .gitverse-inner
              payload_hash="$(sha256sum .gitverse-inner | awk '{print $1}')"
            fi
            test "$payload_hash" = "$canonical_hash"
            echo "PASS GitVerse canonical payload: $canonical_hash  $original (transport: $transport)"
          done < .gitverse-transport-map.tsv

      - name: Summary
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          {
            echo "### GitVerse ${TAG} independent mirror PASS"
            echo '- GitHub release metadata: mirrored and verified'
            echo '- Existing GitVerse bytes are immutable; mismatches fail closed'
            echo '- Unsupported GitVerse asset extensions use deterministic single-file ZIP wrappers'
            echo '- Every canonical payload SHA-256 was re-verified after public GitVerse download'
          } >> "$GITHUB_STEP_SUMMARY"
