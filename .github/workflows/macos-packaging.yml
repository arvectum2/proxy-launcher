name: macOS packaging
on:
  pull_request:
    branches: [main]
    paths:
      - 'proxy_core.py'
      - 'proxy_gui.py'
      - 'proxy_core_legacy.py'
      - 'system_proxy_runtime.py'
      - 'application_filesystem.py'
      - 'configuration_storage.py'
      - 'portable_lifecycle.py'
      - 'macos_*.py'
      - 'tools/build_macos_*.sh'
      - 'tests/test_macos*.py'
      - 'tests/test_proxy_gui.py'
      - 'docs/APL_MAC_*.md'
      - '.github/workflows/macos-packaging.yml'
      - 'assets/**'
      - 'VERSION'
  push:
    branches: [main]
    paths:
      - 'proxy_core.py'
      - 'proxy_gui.py'
      - 'proxy_core_legacy.py'
      - 'system_proxy_runtime.py'
      - 'application_filesystem.py'
      - 'configuration_storage.py'
      - 'portable_lifecycle.py'
      - 'macos_*.py'
      - 'tools/build_macos_*.sh'
      - 'tests/test_macos*.py'
      - 'tests/test_proxy_gui.py'
      - 'docs/APL_MAC_*.md'
      - '.github/workflows/macos-packaging.yml'
      - 'assets/**'
      - 'VERSION'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen build lock
        run: python -m pip install -r requirements-build.lock.txt
      - name: macOS tests
        run: python -m unittest discover -s tests -p 'test_macos*.py' -v
      - name: Build .app and DMG
        env:
          PYTHON_BIN: python
        run: |
          ./tools/build_macos_app.sh
          ./tools/build_macos_dmg.sh
      - name: Inspect .app
        shell: bash
        run: |
          set -euo pipefail
          app='dist/Arvectum Proxy Launcher.app'
          test -d "$app/Contents/MacOS"
          plutil -lint "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = 'ru.arvectum.proxylauncher'
          codesign -dv --verbose=2 "$app" 2>&1 | tee macos-codesign-inspection.txt || true
      - name: Mount and inspect DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find dist/dmg -name '*.dmg' -print -quit)"
          test -f "$dmg"
          hdiutil verify "$dmg"
          mount="$RUNNER_TEMP/apl-dmg"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount" || true' EXIT
          test -d "$mount/Arvectum Proxy Launcher.app"
          test -L "$mount/Applications"
          plutil -lint "$mount/Arvectum Proxy Launcher.app/Contents/Info.plist"
          hdiutil detach "$mount"
          trap - EXIT
      - uses: actions/upload-artifact@v4
        with:
          name: apl-mac-package-${{ matrix.os }}
          path: |
            dist/Arvectum Proxy Launcher.app
            dist/dmg/*.dmg
            macos-codesign-inspection.txt
          if-no-files-found: error
