name: APL-WIN-014 final 0.2.4

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 0.2.4 release-candidate commit (defaults to workflow ref HEAD)
        required: false
        type: string
  push:
    branches:
      - release/apl-win-014-final-0.2.4

permissions:
  contents: read

jobs:
  final-candidate:
    runs-on: windows-2022
    env:
      CANDIDATE_COMMIT: ${{ inputs.source_commit || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}

      - name: Verify exact clean 0.2.4 candidate source
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -cne $env:CANDIDATE_COMMIT) { throw "Checked out $head, expected $env:CANDIDATE_COMMIT" }
          if (git status --porcelain) { throw 'Candidate source checkout is not clean.' }
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($version -ne '0.2.4') { throw "Final candidate must be 0.2.4, got $version" }
          foreach ($path in @(
            'tools/build_apl_win_014_final_0_2_4_candidate.ps1',
            'tools/apl_win_014_final_0_2_4_physical.ps1',
            'tools/apl_win_014_prepare_0_2_4_supplemental_policy.ps1'
          )) {
            $text = Get-Content -LiteralPath $path -Raw
            [void][scriptblock]::Create($text)
          }

          # The policy-authoring helper executes before its own supplemental WDAC
          # policy exists. On the physical host interactive PowerShell is therefore
          # ConstrainedLanguage. Fail the release if this bootstrap script contains
          # any instance/static .NET method invocation; cmdlets, operators and
          # property reads remain allowed.
          $bootstrapPath = 'tools/apl_win_014_prepare_0_2_4_supplemental_policy.ps1'
          $tokens = $null
          $parseErrors = $null
          $bootstrapAst = [System.Management.Automation.Language.Parser]::ParseFile(
            $bootstrapPath,
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors.Count -ne 0) {
            throw "Policy bootstrap parse errors: $($parseErrors -join '; ')"
          }
          $methodCalls = @($bootstrapAst.FindAll({
            param($node)
            $node -is [System.Management.Automation.Language.InvokeMemberExpressionAst]
          }, $true))
          if ($methodCalls.Count -ne 0) {
            $details = $methodCalls | ForEach-Object {
              "line $($_.Extent.StartLineNumber): $($_.Extent.Text)"
            }
            throw "Policy bootstrap is not CLM-safe; method invocation found:`n$($details -join "`n")"
          }
          Write-Host 'Policy bootstrap CLM static gate: PASS (zero method invocations)'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Install exact Inno Setup 6.7.1
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Build once, prove lifecycle, and assemble one physical test kit
        id: candidate
        shell: pwsh
        run: |
          $output = "out\apl-win-014-final-0.2.4-${{ github.run_id }}-${{ github.run_attempt }}"
          ./tools/build_apl_win_014_final_0_2_4_candidate.ps1 `
            -CandidateSourceCommit $env:CANDIDATE_COMMIT `
            -CandidateOutputDirectory $output `
            -PythonExecutable python

          # Seal the policy-authoring helper into the same physical kit and bind its
          # exact identity into both candidate evidence and the physical contract.
          $helperSource = 'tools\apl_win_014_prepare_0_2_4_supplemental_policy.ps1'
          $helperDestination = Join-Path $output 'apl_win_014_prepare_0_2_4_supplemental_policy.ps1'
          Copy-Item -LiteralPath $helperSource -Destination $helperDestination
          $helperItem = Get-Item -LiteralPath $helperDestination
          $helperIdentity = [ordered]@{
            filename = $helperItem.Name
            size = [long]$helperItem.Length
            sha256 = (Get-FileHash -LiteralPath $helperDestination -Algorithm SHA256).Hash.ToLowerInvariant()
          }

          $candidateEvidencePath = Join-Path $output 'candidate_evidence.json'
          $candidateEvidence = Get-Content -LiteralPath $candidateEvidencePath -Raw | ConvertFrom-Json
          $candidateEvidence | Add-Member -NotePropertyName policy_authoring_helper -NotePropertyValue $helperIdentity -Force
          $candidateEvidence | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $candidateEvidencePath -Encoding utf8

          $contractPath = Join-Path $output 'physical_test_contract.json'
          $contract = Get-Content -LiteralPath $contractPath -Raw | ConvertFrom-Json
          $contract.candidate | Add-Member -NotePropertyName policy_authoring_helper_sha256 -NotePropertyValue $helperIdentity.sha256 -Force
          $contract | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $contractPath -Encoding utf8

          # Build a relocatable checksum manifest. Resolve the output root first so
          # FullName and root use the same absolute coordinate system.
          $outputFull = (Resolve-Path -LiteralPath $output).Path
          $sumsPath = Join-Path $outputFull 'SHA256SUMS.txt'
          $sums = Get-ChildItem -LiteralPath $outputFull -File -Recurse |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object FullName |
            ForEach-Object {
              $relative = $_.FullName.Substring($outputFull.Length).TrimStart('\')
              "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $relative"
            }
          Set-Content -LiteralPath $sumsPath -Value $sums -Encoding ascii

          # Verify every manifest entry immediately. A bad path or changed byte is a
          # hard build failure, so an uploaded final kit cannot carry a broken manifest.
          foreach ($line in Get-Content -LiteralPath $sumsPath) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Malformed SHA256SUMS entry: $line" }
            $expectedHash = $Matches[1]
            $relativePath = $Matches[2]
            if ([IO.Path]::IsPathRooted($relativePath)) { throw "SHA256SUMS path must be relative: $relativePath" }
            $manifestFile = Join-Path $outputFull $relativePath
            if (-not (Test-Path -LiteralPath $manifestFile -PathType Leaf)) { throw "SHA256SUMS path does not resolve inside final kit: $relativePath" }
            $actualHash = (Get-FileHash -LiteralPath $manifestFile -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) { throw "SHA256SUMS hash mismatch for $relativePath" }
          }
          Write-Host "SHA256SUMS verified entries: $($sums.Count)"

          $bundlePath = [IO.Path]::GetFullPath("$output.zip")
          Compress-Archive -Path "$outputFull\*" -DestinationPath $bundlePath -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $bundlePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "bundle_path=$bundlePath" >> $env:GITHUB_OUTPUT
          "bundle_sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "FINAL_BUNDLE=$bundlePath"
          Write-Host "FINAL_BUNDLE_SHA256=$hash"
          Write-Host "POLICY_AUTHORING_HELPER_SHA256=$($helperIdentity.sha256)"

      - name: Upload one final 0.2.4 test kit
        uses: actions/upload-artifact@v4
        with:
          name: apl-win-014-final-0.2.4-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.candidate.outputs.bundle_path }}
          if-no-files-found: error
          retention-days: 90
