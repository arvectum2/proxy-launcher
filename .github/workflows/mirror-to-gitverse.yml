name: Mirror to GitVerse

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: mirror-to-gitverse
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Clone GitHub repository as mirror
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git" \
            repository.git

      - name: Push and verify GitVerse refs over SSH
        env:
          GITVERSE_SSH_KEY: ${{ secrets.GITVERSE_SSH_KEY }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        run: |
          set -euo pipefail
          test -n "$GITVERSE_SSH_KEY" || { echo "::error::GITVERSE_SSH_KEY is missing"; exit 1; }
          [[ "$GITVERSE_REPOSITORY" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid GITVERSE_REPO"; exit 1; }
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$GITVERSE_SSH_KEY" > "$ssh_dir/key"
          unset GITVERSE_SSH_KEY
          # Official GitVerse published RSA host fingerprint; fail closed on rotation.
          printf '%s\n' 'gitverse.ru ssh-rsa ' > "$ssh_dir/known_hosts"
          test "$(ssh-keygen -lf "$ssh_dir/known_hosts" | awk '{print $2}' | sort -u)" = 'SHA256:IL4khwaSrT4uHCu9LTUW7dRJyMB5XkOJnFrP0nmdMXU'
          export GIT_SSH_COMMAND="ssh -i '$ssh_dir/key' -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$ssh_dir/known_hosts' -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15"
          echo "Pinned GitVerse host key verified."
          cd repository.git
          git remote add gitverse "git@gitverse.ru:arvectum/${GITVERSE_REPOSITORY}.git"
          gitverse_push() {
            local attempt=1
            until git push --force "$@"; do
              if (( attempt >= 3 )); then
                echo "::error::GitVerse SSH push failed after three attempts"
                return 1
              fi
              sleep $((5 * attempt))
              attempt=$((attempt + 1))
            done
          }
          # Read the latest GitHub ref at execution, not a stale event SHA.
          # Daily/manual reconciliation repairs missed events; exclude refs/pull/*.
          if [[ "$GITHUB_EVENT_NAME" == push && ( "$GITHUB_REF" == refs/heads/* || "$GITHUB_REF" == refs/tags/* ) ]]; then
            if git show-ref --verify --quiet "$GITHUB_REF"; then
              gitverse_push gitverse "$GITHUB_REF:$GITHUB_REF"
              expected="$(git rev-parse "$GITHUB_REF")"
              actual="$(git ls-remote --refs gitverse "$GITHUB_REF" | awk '{print $1}')"
              test "$expected" = "$actual"
            else
              if test -n "$(git ls-remote --refs gitverse "$GITHUB_REF")"; then
                gitverse_push gitverse ":$GITHUB_REF"
              fi
              test -z "$(git ls-remote --refs gitverse "$GITHUB_REF")"
            fi
          else
            gitverse_push --prune gitverse 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
            git for-each-ref --format='%(objectname)%09%(refname)' refs/heads refs/tags | LC_ALL=C sort > "$ssh_dir/expected"
            git ls-remote --refs --heads --tags gitverse | LC_ALL=C sort > "$ssh_dir/actual"
            diff -u "$ssh_dir/expected" "$ssh_dir/actual"
          fi
          echo "GitVerse SSH refs verified."

      - name: Summary
        if: success()
        env:
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        run: |
          echo "### GitVerse mirror updated and verified over SSH" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: ${GITHUB_REPOSITORY}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: arvectum/${GITVERSE_REPOSITORY}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${GITHUB_EVENT_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
