name: Mirror to GitVerse

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: mirror-to-gitverse
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate configuration
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        run: |
          set -euo pipefail
          test -n "$GITVERSE_TOKEN" || { echo "::error::GITVERSE_TOKEN is missing"; exit 1; }
          test -n "$GITVERSE_REPOSITORY" || { echo "::error::GITVERSE_REPO is missing"; exit 1; }

      - name: Clone GitHub repository as mirror
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git" \
            repository.git

      - name: Push branches and tags to GitVerse
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
          GITVERSE_PUSH_DELETED: ${{ github.event.deleted }}
        run: |
          set -euo pipefail
          cd repository.git

          git remote add gitverse \
            "https://arvectum:${GITVERSE_TOKEN}@gitverse.ru/arvectum/${GITVERSE_REPOSITORY}.git"

          # BEGIN REFSCOPED_PUSH
          # A routine push mirrors only its changed ref. Pushing hundreds of
          # unrelated branches on every commit can time out GitVerse (HTTP 504).
          # Manual and daily runs still perform a full prune/reconcile.
          gitverse_push() {
            local attempt=1
            while ! git push --force "$@"; do
              if (( attempt >= 3 )); then
                echo "::error::GitVerse push failed after three attempts"
                return 1
              fi
              echo "::warning::GitVerse push unavailable; bounded retry $attempt"
              sleep $((15 * attempt))
              attempt=$((attempt + 1))
            done
          }

          if [[ "${GITHUB_EVENT_NAME:-}" == "push" &&
                ( "${GITHUB_REF:-}" == refs/heads/* || "${GITHUB_REF:-}" == refs/tags/* ) ]]; then
            if [[ "${GITVERSE_PUSH_DELETED:-false}" == "true" ]]; then
              # A deleted GitHub branch/tag must also be deleted from GitVerse.
              gitverse_push gitverse ":${GITHUB_REF}"
            else
              gitverse_push gitverse "${GITHUB_REF}:${GITHUB_REF}"
            fi
          else
            # Full daily/manual reconciliation, including branch/tag deletes.
            # GitHub-specific refs/pull/* are intentionally excluded.
            gitverse_push --prune gitverse \
              'refs/heads/*:refs/heads/*' \
              'refs/tags/*:refs/tags/*'
          fi
          # END REFSCOPED_PUSH

      - name: Summary
        if: success()
        env:
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        run: |
          echo "### GitVerse mirror updated" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: ${GITHUB_REPOSITORY}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: arvectum/${GITVERSE_REPOSITORY}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${GITHUB_EVENT_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
