name: Russian Production Release Gate

on:
  push:
    branches:
      - main
    paths:
      - 'tools/russian_production_release_gate.ps1'
      - 'tools/apl_rel_014_exact_evidence.py'
      - 'release/APL_REL_013_RUSSIAN_PRODUCTION_RELEASE_GATE.md'
      - 'release/APL_REL_014_EXACT_SIGNED_SET_CONTRACT.json'
      - 'release/APL_REL_014_EXACT_SIGNED_SET_LIFECYCLE_RECOVERY_EVIDENCE.md'
      - 'tests/test_russian_production_release_gate.py'
      - 'tests/test_apl_rel_014_exact_evidence.py'
      - '.github/workflows/russian-production-release-gate.yml'
  pull_request:
    paths:
      - 'tools/russian_production_release_gate.ps1'
      - 'tools/apl_rel_014_exact_evidence.py'
      - 'release/APL_REL_013_RUSSIAN_PRODUCTION_RELEASE_GATE.md'
      - 'release/APL_REL_014_EXACT_SIGNED_SET_CONTRACT.json'
      - 'release/APL_REL_014_EXACT_SIGNED_SET_LIFECYCLE_RECOVERY_EVIDENCE.md'
      - 'tests/test_russian_production_release_gate.py'
      - 'tests/test_apl_rel_014_exact_evidence.py'
      - '.github/workflows/russian-production-release-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: REL-013/014 repository contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run REL-013/014 contract tests
        run: >-
          python -m pytest -q
          tests/test_russian_production_release_gate.py
          tests/test_apl_rel_014_exact_evidence.py

  powershell-syntax:
    name: REL-013 Windows PowerShell syntax
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Parse gate script as UTF-8
        shell: powershell
        run: |
          $file = 'tools/russian_production_release_gate.ps1'
          $tokens = $null
          $errors = $null
          $text = [System.IO.File]::ReadAllText(
            (Resolve-Path $file),
            [System.Text.Encoding]::UTF8
          )
          [System.Management.Automation.Language.Parser]::ParseInput(
            $text,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Error ("line {0}, col {1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
            }
            throw 'PowerShell parse failed: tools/russian_production_release_gate.ps1'
          }
