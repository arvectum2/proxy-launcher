name: Probe GitVerse asset filename validation

on:
  push:
    branches: [diag/gitverse-asset-endpoint]
    paths:
      - .github/workflows/diag-gitverse-sdk-upload.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TAG: v0.2.5
  OWNER: arvectum

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare probe files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .probe-assets
          mkdir .probe-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'apl-rel-015-cfa-hotfix-evidence.json' --dir .probe-assets
          expected="$(awk '$2 == "apl-rel-015-cfa-hotfix-evidence.json" {print $1}' docs/releases/0.2.5-public-assets.sha256)"
          actual="$(sha256sum .probe-assets/apl-rel-015-cfa-hotfix-evidence.json | awk '{print $1}')"
          test -n "$expected" && test "$actual" = "$expected"
          printf 'tiny probe\n' > .probe-assets/tiny.txt
          echo "PASS canonical probe asset SHA-256: $actual"

      - name: Isolate name versus content validation
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        shell: bash
        run: |
          set -uo pipefail
          API='https://api.gitverse.ru'
          ACCEPT='application/vnd.gitverse.object+json;version=1'
          AUTH="Authorization: Bearer $GITVERSE_TOKEN"
          REPO="$GITVERSE_REPOSITORY"
          test -n "$GITVERSE_TOKEN" || exit 1
          test -n "$REPO" || exit 1

          curl -fsS -H "$AUTH" -H "Accept: $ACCEPT" \
            "$API/repos/$OWNER/$REPO/releases/tags/$TAG" > .gitverse-release.json || exit 1
          release_id="$(jq -r '.id' .gitverse-release.json)"
          upload_url="$(jq -r '.upload_url' .gitverse-release.json)"
          echo "release_id=$release_id"
          echo "upload_url=$upload_url"

          list_assets() {
            curl -fsS -H "$AUTH" -H "Accept: $ACCEPT" \
              "$API/repos/$OWNER/$REPO/releases/$release_id/assets?per_page=50&page=1"
          }

          delete_named() {
            local n="$1"
            list_assets > .assets.json || return 1
            while IFS= read -r id; do
              [ -n "$id" ] || continue
              code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "$AUTH" -H "Accept: $ACCEPT" "$API/repos/$OWNER/$REPO/releases/$release_id/assets/$id")"
              case "$code" in 200|202|204) ;; *) echo "cleanup failed $n id=$id HTTP=$code"; return 1;; esac
            done < <(jq -r --arg n "$n" '.[] | select(.name==$n) | .id' .assets.json)
          }

          upload() {
            local label="$1" name="$2" file="$3" type="$4"
            local encoded status
            encoded="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$name")"
            status="$(curl -sS -o ".${label}.json" -w '%{http_code}' -X POST "$upload_url?name=$encoded" -H "$AUTH" -H "Accept: $ACCEPT" -F "attachment=@$file;filename=$name;type=$type")"
            echo "$label HTTP=$status name=$name length=${#name} file_size=$(wc -c < "$file" | tr -d ' ')"
            cat ".${label}.json" || true
            echo
            if [ "$status" = '201' ]; then
              delete_named "$name" || return 2
            fi
            printf '%s' "$status"
          }

          # Remove the successful probe left by the prior diagnostic run.
          delete_named 'apl-gitverse-upload-probe.txt' || exit 1

          short_name='evidence.json'
          short_status="$(upload shortname "$short_name" '.probe-assets/apl-rel-015-cfa-hotfix-evidence.json' 'application/json')"
          echo "RESULT short-name canonical-content=$short_status"

          canonical_name='apl-rel-015-cfa-hotfix-evidence.json'
          tiny_status="$(upload longname "$canonical_name" '.probe-assets/tiny.txt' 'text/plain')"
          echo "RESULT canonical-name tiny-content=$tiny_status"

          medium_name='apl-rel-015-cfa-hotfix.json'
          medium_status="$(upload mediumname "$medium_name" '.probe-assets/apl-rel-015-cfa-hotfix-evidence.json' 'application/json')"
          echo "RESULT medium-name canonical-content=$medium_status"

          # Fail intentionally so diagnostics are never mistaken for release completion.
          exit 1
