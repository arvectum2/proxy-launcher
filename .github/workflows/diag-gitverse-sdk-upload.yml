name: Probe GitVerse canonical release upload URL

on:
  push:
    branches: [diag/gitverse-asset-endpoint]
    paths:
      - .github/workflows/diag-gitverse-sdk-upload.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TAG: v0.2.5
  OWNER: arvectum

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download canonical probe asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .probe-assets
          mkdir .probe-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'apl-rel-015-cfa-hotfix-evidence.json' --dir .probe-assets
          expected="$(awk '$2 == "apl-rel-015-cfa-hotfix-evidence.json" {print $1}' docs/releases/0.2.5-public-assets.sha256)"
          actual="$(sha256sum .probe-assets/apl-rel-015-cfa-hotfix-evidence.json | awk '{print $1}')"
          test -n "$expected" && test "$actual" = "$expected"
          printf 'gitverse upload probe\n' > .probe-assets/apl-gitverse-upload-probe.txt
          echo "PASS canonical probe asset SHA-256: $actual"

      - name: Probe exact release upload_url and filename validation
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        shell: bash
        run: |
          set -uo pipefail
          API='https://api.gitverse.ru'
          ACCEPT='application/vnd.gitverse.object+json;version=1'
          AUTH="Authorization: Bearer $GITVERSE_TOKEN"
          REPO="$GITVERSE_REPOSITORY"
          test -n "$GITVERSE_TOKEN" || exit 1
          test -n "$REPO" || exit 1

          curl -fsS -H "$AUTH" -H "Accept: $ACCEPT" \
            "$API/repos/$OWNER/$REPO/releases/tags/$TAG" > .gitverse-release.json || exit 1
          release_id="$(jq -r '.id' .gitverse-release.json)"
          upload_url="$(jq -r '.upload_url' .gitverse-release.json)"
          echo "release_id=$release_id"
          echo "upload_url=$upload_url"
          test -n "$upload_url" && test "$upload_url" != 'null' || exit 1

          canonical_name='apl-rel-015-cfa-hotfix-evidence.json'
          canonical_encoded="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$canonical_name")"
          canonical_status="$(curl -sS -o .canonical-response.json -w '%{http_code}' \
            -X POST "$upload_url?name=$canonical_encoded" \
            -H "$AUTH" -H "Accept: $ACCEPT" \
            -F "attachment=@.probe-assets/$canonical_name;filename=$canonical_name;type=application/json")"
          echo "canonical exact-upload-url HTTP=$canonical_status"
          cat .canonical-response.json || true

          if [ "$canonical_status" = '201' ]; then
            echo 'CANONICAL_UPLOAD_PASS=1'
            exit 0
          fi

          probe_name='apl-gitverse-upload-probe.txt'
          probe_encoded="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$probe_name")"
          probe_status="$(curl -sS -o .probe-response.json -w '%{http_code}' \
            -X POST "$upload_url?name=$probe_encoded" \
            -H "$AUTH" -H "Accept: $ACCEPT" \
            -F "attachment=@.probe-assets/$probe_name;filename=$probe_name;type=text/plain")"
          echo "simple probe exact-upload-url HTTP=$probe_status"
          cat .probe-response.json || true

          if [ "$probe_status" = '201' ]; then
            echo 'SIMPLE_PROBE_UPLOAD_PASS=1'
            exit 2
          fi

          echo 'BOTH_UPLOADS_FAILED=1'
          exit 1
