name: Probe public GitVerse release URLs

on:
  push:
    branches: [diag/gitverse-asset-endpoint]
    paths:
      - .github/workflows/diag-gitverse-sdk-upload.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public URLs
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://gitverse.ru/arvectum/proxy-launcher' \
            'https://gitverse.ru/arvectum/proxy-launcher/releases' \
            'https://gitverse.ru/arvectum/Proxy-launcher' \
            'https://gitverse.ru/arvectum/Proxy-launcher/releases'; do
            echo "=== $url ==="
            curl -L -sS -o /tmp/body -w 'HTTP=%{http_code} FINAL=%{url_effective}\n' "$url"
            grep -o -m1 '<title>[^<]*</title>' /tmp/body || true
          done
