name: APL-LNX-008 AppImage
on:
  pull_request:
    branches: [main]
    paths:
      - 'proxy_core.py'
      - 'proxy_core_legacy.py'
      - 'system_proxy_runtime.py'
      - 'application_filesystem.py'
      - 'configuration_storage.py'
      - 'portable_lifecycle.py'
      - 'tools/*appimage*'
      - 'tests/test_linux_appimage_packaging.py'
      - 'docs/APL_LNX_008_APPIMAGE.md'
      - '.github/workflows/linux-appimage.yml'
      - 'build_linux.sh'
      - 'VERSION'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.txt'
      - 'APPIMAGE_RUNTIME_LICENSE.txt'
      - 'assets/**'
  push:
    branches: [main]
    paths:
      - 'proxy_core.py'
      - 'proxy_core_legacy.py'
      - 'system_proxy_runtime.py'
      - 'application_filesystem.py'
      - 'configuration_storage.py'
      - 'portable_lifecycle.py'
      - 'tools/*appimage*'
      - 'tests/test_linux_appimage_packaging.py'
      - 'docs/APL_LNX_008_APPIMAGE.md'
      - '.github/workflows/linux-appimage.yml'
      - 'build_linux.sh'
      - 'VERSION'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.txt'
      - 'APPIMAGE_RUNTIME_LICENSE.txt'
      - 'assets/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk curl file
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-build.lock.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Contract tests
        run: .venv/bin/python -m unittest tests.test_linux_appimage_packaging -v
      - name: Frozen application
        run: ./build_linux.sh
      - name: Fetch pinned build-only AppImage toolchain
        run: ./tools/fetch_appimage_toolchain.sh
      - name: Build AppImage
        run: ./tools/build_linux_appimage.sh
      - name: Inspect AppImage without FUSE
        shell: bash
        run: |
          set -euo pipefail
          image="$(find dist/appimage -name '*.AppImage' -print -quit)"
          test -x "$image"
          file "$image" | grep -q ELF
          mkdir "$RUNNER_TEMP/extract" && cd "$RUNNER_TEMP/extract"
          "$GITHUB_WORKSPACE/$image" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/arvectum-proxy-launcher
          test -f squashfs-root/arvectum-proxy-launcher.desktop
          test -L squashfs-root/.DirIcon
          test -f squashfs-root/usr/share/doc/arvectum-proxy-launcher/APPIMAGE_RUNTIME_LICENSE.txt
          grep -q 'AppImage/type2-runtime commit 75849dce7cc37e4319b633df1f116ca895c71a12' squashfs-root/usr/share/doc/arvectum-proxy-launcher/APPIMAGE_RUNTIME_LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apl-lnx-008-appimage
          path: dist/appimage/*.AppImage
          if-no-files-found: error
