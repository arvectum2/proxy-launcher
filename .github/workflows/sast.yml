name: SAST

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  schedule:
    - cron: '7 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up build Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: BUILD_PYTHON_VERSION

      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check --no-cache-dir bandit==1.9.4

      - name: Scan Python application code
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p sast

          set +e
          bandit -ll -ii -f json -o sast/bandit.json proxy_core.py proxy_gui.py
          status=$?
          bandit -ll -ii -f txt -o sast/bandit.txt proxy_core.py proxy_gui.py >/dev/null 2>&1 || true
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Bandit SAST PASS: no medium-or-higher severity findings with medium-or-higher confidence."
          elif [ "$status" -eq 1 ]; then
            echo "Bandit SAST FAIL: security findings crossed the configured gate." >&2
          else
            echo "Bandit SAST ERROR: scanner execution failed with exit code $status." >&2
          fi
          exit "$status"

      - name: Upload SAST report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arvectum-proxy-launcher-sast-${{ github.sha }}
          path: |
            sast/bandit.json
            sast/bandit.txt
          if-no-files-found: error
          retention-days: 30
