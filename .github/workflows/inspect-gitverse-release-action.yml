name: Inspect GitVerse release interfaces

on:
  push:
    branches:
      - ops/gitverse-native-release-v025
    paths:
      - .github/workflows/inspect-gitverse-release-action.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Inspect official GitVerse release action upload contract
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://gitverse.ru/actions/create-release.git action-src
          echo '=== official upload implementation ==='
          sed -n '80,115p' action-src/internal/adapter/httpreleases/releases.go

      - name: Inspect GitVerse MCP release and asset tools
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys

          sys.path.insert(0, 'scripts')
          from sync_gitverse_release import GitVerseClient

          client = GitVerseClient(os.environ['GITVERSE_TOKEN'], 'arvectum', 'proxy-launcher')
          client.initialize_mcp()
          print('=== matching MCP tools ===')
          matched = 0
          for name in sorted(client.tools):
              if any(word in name.lower() for word in ('release', 'asset', 'attach', 'upload')):
                  matched += 1
                  tool = client.tools[name]
                  print(name)
                  print(json.dumps(tool.get('inputSchema') or tool.get('input_schema') or {}, ensure_ascii=False, sort_keys=True))
          print(f'MATCHED={matched}')
          PY
