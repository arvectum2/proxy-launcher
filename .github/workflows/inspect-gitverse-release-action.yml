name: Inspect GitVerse release interfaces

on:
  push:
    branches:
      - ops/gitverse-native-release-v025
    paths:
      - .github/workflows/inspect-gitverse-release-action.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Probe canonical GitVerse upload URL with one verified asset
        env:
          GH_TOKEN: ${{ github.token }}
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.gitverse.ru'
          ACCEPT='application/vnd.gitverse.object+json;version=1'
          AUTH="Authorization: Bearer $GITVERSE_TOKEN"
          TAG='v0.2.5'
          NAME='apl-rel-015-cfa-hotfix-evidence.json'
          EXPECTED='d6c1d1f1b6894be45a0535b9ef5ffa6df61ddcfddc08fc688becd91b32609646'

          curl -fsS -H "$AUTH" -H "Accept: $ACCEPT" \
            "$API/repos/arvectum/proxy-launcher/releases/tags/$TAG" > release.json
          UPLOAD_URL="$(jq -r '.upload_url' release.json)"
          RID="$(jq -r '.id' release.json)"
          echo "Canonical upload URL: $UPLOAD_URL"

          mkdir -p probe
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir probe
          test "$(sha256sum "probe/$NAME" | awk '{print $1}')" = "$EXPECTED"

          current_count="$(curl -fsS -H "$AUTH" -H "Accept: $ACCEPT" \
            "$API/repos/arvectum/proxy-launcher/releases/$RID/assets?per_page=50&page=1" | \
            jq --arg name "$NAME" '[.[] | select(.name == $name)] | length')"
          if [ "$current_count" = '1' ]; then
            echo 'PASS desired probe asset already exists.'
            exit 0
          fi
          test "$current_count" = '0'

          status="$(curl -sS -o response.json -w '%{http_code}' \
            --http1.1 -X POST \
            -H "$AUTH" -H "Accept: $ACCEPT" \
            -F "attachment=@probe/$NAME" \
            "$UPLOAD_URL?name=$NAME")"
          echo "HTTP $status"
          cat response.json || true
          echo
          test "$status" = '201'
          echo 'UPLOAD_CANONICAL_URL_PASS'
