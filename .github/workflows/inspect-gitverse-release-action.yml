name: Inspect official GitVerse release action

on:
  push:
    branches:
      - ops/gitverse-native-release-v025
    paths:
      - .github/workflows/inspect-gitverse-release-action.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone official GitVerse action and show release client sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://gitverse.ru/actions/create-release.git action-src
          echo '=== action.yml ==='
          cat action-src/action.yml
          echo '=== Go files ==='
          find action-src/internal action-src/cmd -type f -name '*.go' -print
          echo '=== release/http/upload related source ==='
          grep -RniE 'multipart|attachment|upload|asset|release|api.gitverse|Content-Type|FormFile|CreateForm' action-src/internal action-src/cmd || true
          echo '=== internal/client/gitverse/http.go ==='
          cat action-src/internal/client/gitverse/http.go
