name: Inspect official GitVerse release action

on:
  push:
    branches:
      - ops/gitverse-native-release-v025
    paths:
      - .github/workflows/inspect-gitverse-release-action.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone official GitVerse action and show runtime contract
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://gitverse.ru/actions/create-release.git action-src
          echo '=== action.yml ==='
          cat action-src/action.yml
          echo '=== cmd/releaseaction/main.go ==='
          cat action-src/cmd/releaseaction/main.go
          echo '=== internal/adapter/httpreleases/releases.go ==='
          cat action-src/internal/adapter/httpreleases/releases.go
          echo '=== internal/dto/releases.go ==='
          cat action-src/internal/dto/releases.go
          echo '=== go.mod ==='
          cat action-src/go.mod
