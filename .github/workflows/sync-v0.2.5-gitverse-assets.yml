name: Sync v0.2.5 GitVerse assets

on:
  push:
    branches:
      - main
      - fix/gitverse-transport-wrappers
    paths:
      - .github/workflows/sync-v0.2.5-gitverse-assets.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TAG: v0.2.5

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify canonical GitHub v0.2.5 assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sync-assets .gitverse-transport
          mkdir -p .sync-assets .gitverse-transport
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir .sync-assets
          expected_count="$(wc -l < docs/releases/0.2.5-public-assets.sha256 | tr -d ' ')"
          actual_count="$(find .sync-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$expected_count" = '9'
          test "$actual_count" = "$expected_count"
          (cd .sync-assets && sha256sum -c ../docs/releases/0.2.5-public-assets.sha256)

      - name: Build lossless GitVerse transport set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile

          rows = []
          source = Path('.sync-assets')
          out = Path('.gitverse-transport')
          for line in Path('docs/releases/0.2.5-public-assets.sha256').read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              expected_hash, original = line.split('  ', 1)
              src = source / original
              if hashlib.sha256(src.read_bytes()).hexdigest() != expected_hash:
                  raise SystemExit(f'canonical hash mismatch before transport: {original}')
              if original.endswith('.zip') or original.endswith('.txt'):
                  transport, mode = original, 'direct'
                  (out / transport).write_bytes(src.read_bytes())
              else:
                  transport, mode = original + '.zip', 'wrapper'
                  info = zipfile.ZipInfo(original, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  with zipfile.ZipFile(out / transport, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                      zf.writestr(info, src.read_bytes())
              transport_hash = hashlib.sha256((out / transport).read_bytes()).hexdigest()
              rows.append((expected_hash, original, transport, mode, transport_hash))
          if len(rows) != 9 or len({r[2] for r in rows}) != 9:
              raise SystemExit('GitVerse transport set must contain exactly 9 unique assets')
          Path('.gitverse-transport-map.tsv').write_text(
              ''.join('\t'.join(r) + '\n' for r in rows), encoding='utf-8')
          for row in rows:
              print('\t'.join(row))
          PY

          test "$(find .gitverse-transport -maxdepth 1 -type f | wc -l | tr -d ' ')" = '9'
          while IFS=$'\t' read -r expected_hash original transport mode transport_hash; do
            f=".gitverse-transport/$transport"
            test "$(sha256sum "$f" | awk '{print $1}')" = "$transport_hash"
            if [ "$mode" = direct ]; then
              test "$transport" = "$original"
              test "$(sha256sum "$f" | awk '{print $1}')" = "$expected_hash"
            else
              test "$transport" = "$original.zip"
              test "$(unzip -Z1 "$f" | wc -l | tr -d ' ')" = 1
              test "$(unzip -Z1 "$f")" = "$original"
              unzip -p "$f" "$original" > .inner
              test "$(sha256sum .inner | awk '{print $1}')" = "$expected_hash"
            fi
          done < .gitverse-transport-map.tsv

      - name: Sync exact 9-item GitVerse transport set
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.gitverse.ru'
          OWNER='arvectum'
          REPO="$GITVERSE_REPOSITORY"
          ACCEPT='application/vnd.gitverse.object+json;version=1'
          AUTH="Authorization: Bearer $GITVERSE_TOKEN"
          test -n "$GITVERSE_TOKEN"
          test -n "$REPO"

          curl -fsS -H "$AUTH" -H "Accept: $ACCEPT" \
            "$API/repos/$OWNER/$REPO/releases/tags/$TAG" > .release.json
          release_id="$(jq -r '.id' .release.json)"
          upload_url="$(jq -r '.upload_url' .release.json)"
          test -n "$release_id" && test "$release_id" != null
          test -n "$upload_url" && test "$upload_url" != null

          list_assets() {
            curl -fsS -H "$AUTH" -H "Accept: $ACCEPT" \
              "$API/repos/$OWNER/$REPO/releases/$release_id/assets?per_page=50&page=1"
          }
          delete_id() {
            local id="$1" name="$2" status
            status="$(curl -sS -o .delete.json -w '%{http_code}' -X DELETE \
              -H "$AUTH" -H "Accept: $ACCEPT" \
              "$API/repos/$OWNER/$REPO/releases/$release_id/assets/$id")"
            case "$status" in 200|202|204) ;; *)
              echo "::error::GitVerse delete failed for $name id=$id HTTP=$status"
              cat .delete.json || true
              exit 1;;
            esac
          }
          verify_payload() {
            local file="$1" expected="$2" original="$3" transport="$4" mode="$5"
            if [ "$mode" = direct ]; then
              test "$(sha256sum "$file" | awk '{print $1}')" = "$expected"
            else
              test "$(unzip -Z1 "$file" | wc -l | tr -d ' ')" = 1
              test "$(unzip -Z1 "$file")" = "$original"
              unzip -p "$file" "$original" > .downloaded-inner
              test "$(sha256sum .downloaded-inner | awk '{print $1}')" = "$expected"
            fi
          }

          cut -f3 .gitverse-transport-map.tsv | sort > .expected-names
          list_assets > .assets.json
          while IFS=$'\t' read -r id name; do
            if ! grep -Fxq "$name" .expected-names; then
              delete_id "$id" "$name"
              echo "REMOVED unexpected GitVerse asset: $name"
            fi
          done < <(jq -r '.[] | [.id,.name] | @tsv' .assets.json)

          list_assets > .assets.json
          while IFS=$'\t' read -r expected_hash original transport mode transport_hash; do
            local_file=".gitverse-transport/$transport"
            count="$(jq --arg n "$transport" '[.[] | select(.name==$n)] | length' .assets.json)"
            if [ "$count" -gt 1 ]; then
              while IFS= read -r id; do delete_id "$id" "$transport"; done \
                < <(jq -r --arg n "$transport" '.[] | select(.name==$n) | .id' .assets.json)
              list_assets > .assets.json
              count=0
            fi
            if [ "$count" -eq 1 ]; then
              id="$(jq -r --arg n "$transport" '.[] | select(.name==$n) | .id' .assets.json)"
              url="$(jq -r --arg n "$transport" '.[] | select(.name==$n) | .browser_download_url' .assets.json)"
              if curl -LfsS "$url" -o .existing \
                && verify_payload .existing "$expected_hash" "$original" "$transport" "$mode"; then
                echo "PASS existing: $transport -> $original"
                continue
              fi
              delete_id "$id" "$transport"
              list_assets > .assets.json
            fi
            encoded="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$transport")"
            case "$transport" in *.txt) mime='text/plain';; *) mime='application/zip';; esac
            status="$(curl -sS -o .upload.json -w '%{http_code}' -X POST \
              "$upload_url?name=$encoded" -H "$AUTH" -H "Accept: $ACCEPT" \
              -F "attachment=@$local_file;filename=$transport;type=$mime")"
            test "$status" = 201 || {
              echo "::error::GitVerse upload failed for $transport HTTP=$status"
              cat .upload.json || true
              exit 1
            }
            echo "UPLOADED: $transport -> $original"
            list_assets > .assets.json
          done < .gitverse-transport-map.tsv

      - name: Verify release and all 9 canonical payloads from GitVerse
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.gitverse.ru'
          OWNER='arvectum'
          REPO="$GITVERSE_REPOSITORY"
          ACCEPT='application/vnd.gitverse.object+json;version=1'
          AUTH="Authorization: Bearer $GITVERSE_TOKEN"

          curl -fsS -H "$AUTH" -H "Accept: $ACCEPT" \
            "$API/repos/$OWNER/$REPO/releases/tags/$TAG" > .release.json
          test "$(jq -r '.tag_name' .release.json)" = "$TAG"
          test "$(jq -r '.name' .release.json)" = 'Arvectum Proxy Launcher 0.2.5'
          test "$(jq -r '.draft' .release.json)" = false
          test "$(jq -r '.prerelease' .release.json)" = false
          printf '%s' "$(jq -r '.body' .release.json)" > .actual-notes.md
          python - <<'PY'
          from pathlib import Path
          expected = Path('docs/releases/0.2.5.md').read_text(encoding='utf-8').rstrip('\n')
          actual = Path('.actual-notes.md').read_text(encoding='utf-8')
          if actual != expected:
              raise SystemExit('GitVerse release notes differ from canonical docs/releases/0.2.5.md')
          print('PASS canonical GitVerse release notes')
          PY

          release_id="$(jq -r '.id' .release.json)"
          curl -fsS -H "$AUTH" -H "Accept: $ACCEPT" \
            "$API/repos/$OWNER/$REPO/releases/$release_id/assets?per_page=50&page=1" > .assets.json
          test "$(jq 'length' .assets.json)" -eq 9
          cut -f3 .gitverse-transport-map.tsv | sort > .expected-names
          jq -r '.[].name' .assets.json | sort > .actual-names
          diff -u .expected-names .actual-names

          while IFS=$'\t' read -r expected_hash original transport mode transport_hash; do
            test "$(jq --arg n "$transport" '[.[] | select(.name==$n)] | length' .assets.json)" -eq 1
            url="$(jq -r --arg n "$transport" '.[] | select(.name==$n) | .browser_download_url' .assets.json)"
            curl -LfsS "$url" -o .verified
            if [ "$mode" = direct ]; then
              actual_hash="$(sha256sum .verified | awk '{print $1}')"
            else
              test "$(unzip -Z1 .verified | wc -l | tr -d ' ')" = 1
              test "$(unzip -Z1 .verified)" = "$original"
              unzip -p .verified "$original" > .inner
              actual_hash="$(sha256sum .inner | awk '{print $1}')"
            fi
            test "$actual_hash" = "$expected_hash"
            echo "PASS GitVerse canonical SHA-256: $expected_hash  $original (transport: $transport)"
          done < .gitverse-transport-map.tsv

      - name: Verify GitVerse README matches GitHub main
        if: github.ref_name == 'main'
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.gitverse.ru'
          OWNER='arvectum'
          REPO="$GITVERSE_REPOSITORY"
          ACCEPT='application/vnd.gitverse.object+json;version=1'
          AUTH="Authorization: Bearer $GITVERSE_TOKEN"
          expected="$(sha256sum README.md | awk '{print $1}')"
          for attempt in 1 2 3 4 5 6; do
            curl -fsS -H "$AUTH" -H "Accept: $ACCEPT" \
              "$API/repos/$OWNER/$REPO/contents/README.md?ref=main" > .readme.json
            jq -r '.content' .readme.json | tr -d '\n' | base64 --decode > .gitverse-readme
            actual="$(sha256sum .gitverse-readme | awk '{print $1}')"
            if [ "$actual" = "$expected" ]; then
              echo "PASS GitVerse README SHA-256: $actual"
              exit 0
            fi
            echo "README mirror not converged yet ($attempt/6): $actual != $expected"
            sleep 10
          done
          exit 1

      - name: Summary
        shell: bash
        run: |
          {
            echo '### GitVerse v0.2.5 independent mirror PASS'
            echo '- release metadata and canonical bilingual notes: verified'
            echo '- transport assets: exact 9/9 expected names'
            echo '- canonical payloads: all 9/9 SHA-256 values verified after public download from GitVerse'
            echo '- GitVerse-rejected direct extensions: losslessly carried in single-file ZIP wrappers'
          } >> "$GITHUB_STEP_SUMMARY"
