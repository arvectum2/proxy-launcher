name: Sync v0.2.5 GitVerse assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-v0.2.5-gitverse-assets.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TAG: v0.2.5

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Inspect official GitVerse create-release implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .gitverse-create-release
          git clone --depth 1 https://gitverse.ru/actions/create-release.git .gitverse-create-release
          echo '=== action.yml ==='
          cat .gitverse-create-release/action.yml
          echo '=== cmd/releaseaction/main.go ==='
          sed -n '1,220p' .gitverse-create-release/cmd/releaseaction/main.go
          echo '=== internal/adapter/httpreleases/releases.go ==='
          sed -n '1,180p' .gitverse-create-release/internal/adapter/httpreleases/releases.go
          echo '=== internal/client/gitverse/http.go ==='
          sed -n '1,220p' .gitverse-create-release/internal/client/gitverse/http.go
          echo '=== internal/service/releases.go ==='
          sed -n '1,180p' .gitverse-create-release/internal/service/releases.go

      - name: Download and verify canonical GitHub v0.2.5 assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sync-assets
          mkdir -p .sync-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir .sync-assets
          expected_count="$(wc -l < docs/releases/0.2.5-public-assets.sha256 | tr -d ' ')"
          actual_count="$(find .sync-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$expected_count" = '9'
          test "$actual_count" = "$expected_count"
          (cd .sync-assets && sha256sum -c ../docs/releases/0.2.5-public-assets.sha256)

      - name: Upload exact assets to existing GitVerse v0.2.5 release
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.gitverse.ru'
          OWNER='arvectum'
          REPO="$GITVERSE_REPOSITORY"
          ACCEPT='application/vnd.gitverse.object+json;version=1'
          AUTH="Authorization: Bearer $GITVERSE_TOKEN"

          status="$(curl -sS -o .gitverse-release.json -w '%{http_code}' -H "$AUTH" -H "Accept: $ACCEPT" "$API/repos/$OWNER/$REPO/releases/tags/$TAG")"
          test "$status" = '200'
          release_id="$(jq -r '.id' .gitverse-release.json)"
          curl -fsS -H "$AUTH" -H "Accept: $ACCEPT" "$API/repos/$OWNER/$REPO/releases/$release_id/assets?per_page=50&page=1" > .gitverse-assets.json

          while IFS= read -r expected_line; do
            [ -n "$expected_line" ] || continue
            expected_hash="${expected_line%% *}"
            name="${expected_line#*  }"
            local_file=".sync-assets/$name"
            duplicate_count="$(jq --arg name "$name" '[.[] | select(.name == $name)] | length' .gitverse-assets.json)"
            if [ "$duplicate_count" -eq 1 ]; then
              url="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .browser_download_url' .gitverse-assets.json)"
              curl -LfsS -H "$AUTH" -H "Accept: $ACCEPT" "$url" -o .gitverse-existing-asset
              test "$(sha256sum .gitverse-existing-asset | awk '{print $1}')" = "$expected_hash"
              continue
            fi
            encoded_name="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$name")"
            upload_status="$(curl -sS -o .gitverse-upload.json -w '%{http_code}' -X POST "$API/repos/$OWNER/$REPO/releases/$release_id/assets?name=$encoded_name" -H "$AUTH" -H "Accept: $ACCEPT" -H 'Content-Type: multipart/form-data' -F "attachment=@$local_file")"
            test "$upload_status" = '201' || { cat .gitverse-upload.json; exit 1; }
            curl -fsS -H "$AUTH" -H "Accept: $ACCEPT" "$API/repos/$OWNER/$REPO/releases/$release_id/assets?per_page=50&page=1" > .gitverse-assets.json
          done < docs/releases/0.2.5-public-assets.sha256

          awk '{print $2}' docs/releases/0.2.5-public-assets.sha256 | sort > .expected-names
          jq -r '.[].name' .gitverse-assets.json | sort > .actual-names
          diff -u .expected-names .actual-names
          while IFS= read -r expected_line; do
            [ -n "$expected_line" ] || continue
            expected_hash="${expected_line%% *}"
            name="${expected_line#*  }"
            url="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .browser_download_url' .gitverse-assets.json)"
            curl -LfsS -H "$AUTH" -H "Accept: $ACCEPT" "$url" -o .gitverse-verify-asset
            test "$(sha256sum .gitverse-verify-asset | awk '{print $1}')" = "$expected_hash"
          done < docs/releases/0.2.5-public-assets.sha256

      - name: Verify GitVerse README matches GitHub main
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.gitverse.ru'; OWNER='arvectum'; REPO="$GITVERSE_REPOSITORY"; ACCEPT='application/vnd.gitverse.object+json;version=1'; AUTH="Authorization: Bearer $GITVERSE_TOKEN"
          expected="$(sha256sum README.md | awk '{print $1}')"
          curl -fsS -H "$AUTH" -H "Accept: $ACCEPT" "$API/repos/$OWNER/$REPO/contents/README.md?ref=main" > .gitverse-readme.json
          jq -r '.content' .gitverse-readme.json | tr -d '\n' | base64 --decode > .gitverse-README.md
          actual="$(sha256sum .gitverse-README.md | awk '{print $1}')"
          test "$actual" = "$expected"
          echo "PASS GitVerse README SHA-256: $actual"

      - name: Summary
        shell: bash
        run: |
          echo '### GitVerse v0.2.5 mirror PASS' >> "$GITHUB_STEP_SUMMARY"
