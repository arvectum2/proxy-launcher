name: GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-evidence.yml'
      - '.github/workflows/windows-p0.yml'
      - '.github/workflows/linux-deb.yml'
      - '.github/workflows/linux-rpm.yml'
      - '.github/workflows/linux-appimage.yml'
      - '.github/workflows/macos-packaging.yml'
      - '.github/workflows/sync-release-to-gitverse.yml'
      - 'build_linux.sh'
      - 'tools/build_linux_deb.sh'
      - 'tools/build_linux_rpm.sh'
      - 'tools/build_linux_appimage.sh'
      - 'tools/fetch_appimage_toolchain.sh'
      - 'tools/appimage-toolchain.lock'
      - 'APPIMAGE_RUNTIME_LICENSE.txt'
      - 'docs/releases/*.md'
      - 'VERSION'
      - 'RELEASE_POLICY.md'
      - 'tests/test_release_automation.py'
      - 'tests/test_linux_rpm_packaging.py'
      - 'tests/test_linux_appimage_packaging.py'
      - 'tests/test_release_evidence.py'
      - 'tests/test_version_policy.py'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate release context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.parse.outputs.version }}
      expected_tag: ${{ steps.parse.outputs.expected_tag }}
      artifact_name: ${{ steps.parse.outputs.artifact_name }}
      zip_name: ${{ steps.parse.outputs.zip_name }}
      setup_name: ${{ steps.parse.outputs.setup_name }}
      linux_deb_name: ${{ steps.parse.outputs.linux_deb_name }}
      linux_run_id: ${{ steps.parse.outputs.linux_run_id }}
      linux_rpm_name: ${{ steps.parse.outputs.linux_rpm_name }}
      linux_rpm_run_id: ${{ steps.parse.outputs.linux_rpm_run_id }}
      linux_appimage_name: ${{ steps.parse.outputs.linux_appimage_name }}
      linux_appimage_run_id: ${{ steps.parse.outputs.linux_appimage_run_id }}
      macos_arm_name: ${{ steps.parse.outputs.macos_arm_name }}
      macos_x64_name: ${{ steps.parse.outputs.macos_x64_name }}
      macos_run_id: ${{ steps.parse.outputs.macos_run_id }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      should_publish: ${{ steps.parse.outputs.should_publish }}
      owner_signed_release: ${{ steps.parse.outputs.owner_signed_release }}
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate VERSION and context
        id: parse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ ! -f VERSION ]; then
            echo "::error::VERSION file is missing"
            exit 1
          fi

          VERSION="$(tr -d '[:space:]' < VERSION)"
          SEMVER_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$VERSION" =~ $SEMVER_REGEX ]]; then
            echo "::error::VERSION '$VERSION' is not valid SemVer"
            exit 1
          fi

          EXPECTED_TAG="v${VERSION}"
          ARTIFACT_NAME="Arvectum-Proxy-Launcher-${VERSION}-windows-x64-portable"
          ZIP_NAME="${ARTIFACT_NAME}.zip"
          SETUP_NAME="Arvectum-Proxy-Launcher-${VERSION}-windows-x64-setup.exe"
          LINUX_DEB_NAME="Arvectum-Proxy-Launcher-${VERSION}-astra-linux-amd64.deb"
          LINUX_RPM_NAME="Arvectum-Proxy-Launcher-${VERSION}-redos-linux-x86_64.rpm"
          LINUX_APPIMAGE_NAME="Arvectum_Proxy_Launcher-${VERSION}-x86_64.AppImage"
          MACOS_ARM_NAME="Arvectum-Proxy-Launcher-${VERSION}-macos-arm64.dmg"
          MACOS_X64_NAME="Arvectum-Proxy-Launcher-${VERSION}-macos-x64.dmg"

          PRERELEASE="false"
          if [[ "$VERSION" =~ - ]]; then
            PRERELEASE="true"
          fi

          # 0.2.5 is an exact-byte, owner-operated Russian signed release.
          # Its physically accepted Setup/application bytes are bound by APL-REL-015.
          # Rebuilding from the tag can produce different one-file executable bytes,
          # so the tag workflow MUST NOT publish replacement CI binaries.
          OWNER_SIGNED_RELEASE="false"
          if [ "$VERSION" = "0.2.5" ]; then
            OWNER_SIGNED_RELEASE="true"
          fi

          echo "Canonical product version: $VERSION"
          echo "Expected tag: $EXPECTED_TAG"
          echo "Prerelease: $PRERELEASE"
          echo "Owner-operated signed release: $OWNER_SIGNED_RELEASE"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "expected_tag=${EXPECTED_TAG}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "setup_name=${SETUP_NAME}" >> "$GITHUB_OUTPUT"
          echo "linux_deb_name=${LINUX_DEB_NAME}" >> "$GITHUB_OUTPUT"
          echo "linux_rpm_name=${LINUX_RPM_NAME}" >> "$GITHUB_OUTPUT"
          echo "linux_appimage_name=${LINUX_APPIMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "macos_arm_name=${MACOS_ARM_NAME}" >> "$GITHUB_OUTPUT"
          echo "macos_x64_name=${MACOS_X64_NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "owner_signed_release=${OWNER_SIGNED_RELEASE}" >> "$GITHUB_OUTPUT"

          # Evaluate trigger context and guards
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
            if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
              echo "::error::Pushed tag '$TAG_NAME' does not match expected tag '$EXPECTED_TAG' for VERSION '$VERSION'"
              exit 1
            fi

            # Check that tag commit is an ancestor of main
            git fetch origin main --no-tags
            if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
              echo "::error::Tag commit ${{ github.sha }} is not an ancestor of origin/main"
              exit 1
            fi

            # Check prior green canonical main CI
            RUNS_JSON="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&branch=main&event=push" --jq '.workflow_runs')"
            SUCCESSFUL_PORTABLE_RUN="$(echo "$RUNS_JSON" | jq -e '.[] | select((.path == ".github/workflows/windows-p0.yml" or .name == "Windows P0 portable") and .conclusion == "success")' || true)"
            SUCCESSFUL_INSTALLER_RUN="$(echo "$RUNS_JSON" | jq -e '.[] | select((.path == ".github/workflows/windows-installer.yml" or .name == "Windows installer") and .conclusion == "success")' || true)"
            LINUX_RUNS_JSON="$(gh api "repos/${{ github.repository }}/actions/workflows/linux-deb.yml/runs?head_sha=${{ github.sha }}&branch=main&event=push&per_page=20" --jq '.workflow_runs')"
            SUCCESSFUL_LINUX_RUN="$(echo "$LINUX_RUNS_JSON" | jq -e '.[] | select(.conclusion == "success")' || true)"
            LINUX_RUN_ID="$(echo "$LINUX_RUNS_JSON" | jq -r '[.[] | select(.conclusion == "success")] | sort_by(.id) | last | .id // empty')"
            RPM_RUNS_JSON="$(gh api "repos/${{ github.repository }}/actions/workflows/linux-rpm.yml/runs?head_sha=${{ github.sha }}&branch=main&event=push&per_page=20" --jq '.workflow_runs')"
            SUCCESSFUL_RPM_RUN="$(echo "$RPM_RUNS_JSON" | jq -e '.[] | select(.conclusion == "success")' || true)"
            LINUX_RPM_RUN_ID="$(echo "$RPM_RUNS_JSON" | jq -r '[.[] | select(.conclusion == "success")] | sort_by(.id) | last | .id // empty')"
            APPIMAGE_RUNS_JSON="$(gh api "repos/${{ github.repository }}/actions/workflows/linux-appimage.yml/runs?head_sha=${{ github.sha }}&branch=main&event=push&per_page=20" --jq '.workflow_runs')"
            SUCCESSFUL_APPIMAGE_RUN="$(echo "$APPIMAGE_RUNS_JSON" | jq -e '.[] | select(.conclusion == "success")' || true)"
            LINUX_APPIMAGE_RUN_ID="$(echo "$APPIMAGE_RUNS_JSON" | jq -r '[.[] | select(.conclusion == "success")] | sort_by(.id) | last | .id // empty')"
            MACOS_RUNS_JSON="$(gh api "repos/${{ github.repository }}/actions/workflows/macos-packaging.yml/runs?head_sha=${{ github.sha }}&branch=main&event=push&per_page=20" --jq '.workflow_runs')"
            SUCCESSFUL_MACOS_RUN="$(echo "$MACOS_RUNS_JSON" | jq -e '.[] | select(.conclusion == "success")' || true)"
            MACOS_RUN_ID="$(echo "$MACOS_RUNS_JSON" | jq -r '[.[] | select(.conclusion == "success")] | sort_by(.id) | last | .id // empty')"
            if [ -z "$SUCCESSFUL_PORTABLE_RUN" ] || [ -z "$SUCCESSFUL_INSTALLER_RUN" ] || [ -z "$SUCCESSFUL_LINUX_RUN" ] || [ -z "$LINUX_RUN_ID" ] || [ -z "$SUCCESSFUL_RPM_RUN" ] || [ -z "$LINUX_RPM_RUN_ID" ] || [ -z "$SUCCESSFUL_APPIMAGE_RUN" ] || [ -z "$LINUX_APPIMAGE_RUN_ID" ] || [ -z "$SUCCESSFUL_MACOS_RUN" ] || [ -z "$MACOS_RUN_ID" ]; then
              echo "::error::Commit ${{ github.sha }} requires successful Windows P0 portable, Windows installer, Linux Debian package, RED OS RPM, and Linux AppImage push CI, plus macOS packaging push CI"
              exit 1
            fi
            echo "linux_run_id=${LINUX_RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "linux_rpm_run_id=${LINUX_RPM_RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "linux_appimage_run_id=${LINUX_APPIMAGE_RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "macos_run_id=${MACOS_RUN_ID}" >> "$GITHUB_OUTPUT"

            EVIDENCE_RUNS_JSON="$(gh api "repos/${{ github.repository }}/actions/workflows/release-evidence.yml/runs?head_sha=${{ github.sha }}&branch=main&event=workflow_run&per_page=20" --jq '.workflow_runs')"
            SUCCESSFUL_EVIDENCE_RUN="$(echo "$EVIDENCE_RUNS_JSON" | jq -e '.[] | select(.name == "Release Evidence Package" and .conclusion == "success")' || true)"
            if [ -z "$SUCCESSFUL_EVIDENCE_RUN" ]; then
              echo "::error::Commit ${{ github.sha }} requires a successful Release Evidence Package for the exact main SHA"
              exit 1
            fi

            if [ "$OWNER_SIGNED_RELEASE" = "true" ]; then
              echo "Owner-signed exact-byte release profile detected."
              echo "Automated CI rebuild publication is intentionally disabled for $TAG_NAME."
              echo "Publish only the REL-011/012/013/015 verified owner-signed directory."
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
            else
              # Generic automated-release path: preserve duplicate-release immutability.
              if gh release view "$TAG_NAME" >/dev/null 2>&1; then
                echo "::error::GitHub Release for tag '$TAG_NAME' already exists; immutable release policy forbids overwrite"
                exit 1
              fi
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.ref }}" != "refs/heads/main" ]; then
              echo "::error::workflow_dispatch dry-run is only permitted on refs/heads/main"
              exit 1
            fi
            echo "Manual workflow_dispatch dry-run on main: validation PASSED (publish disabled)"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Pull request validation: PASSED (publish disabled)"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Windows portable
    needs: validate
    if: github.event_name != 'pull_request' && needs.validate.outputs.owner_signed_release != 'true'
    uses: ./.github/workflows/windows-p0.yml

  installer:
    name: Build Windows installer
    needs: validate
    if: github.event_name != 'pull_request' && needs.validate.outputs.owner_signed_release != 'true'
    uses: ./.github/workflows/windows-installer.yml

  publish:
    name: Publish GitHub Release
    needs:
      - validate
      - build
      - installer
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.validate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate.outputs.artifact_name }}
          path: release-stage

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.installer.outputs.artifact_name }}
          path: release-stage

      - name: Download exact-main Astra/Linux Debian artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-linux
          gh run download "${{ needs.validate.outputs.linux_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name apl-lnx-007-deb-ubuntu-22.04 \
            --dir release-linux
          source_deb="$(find release-linux -type f -name 'arvectum-proxy-launcher_*.deb' -print -quit)"
          test -n "$source_deb"
          test "$(dpkg-deb -f "$source_deb" Package)" = "arvectum-proxy-launcher"
          test "$(dpkg-deb -f "$source_deb" Version)" = "${{ needs.validate.outputs.version }}"
          test "$(dpkg-deb -f "$source_deb" Architecture)" = "amd64"
          cp "$source_deb" "release-stage/${{ needs.validate.outputs.linux_deb_name }}"

      - name: Install RPM inspection tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Download exact-main RED OS RPM artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-rpm
          gh run download "${{ needs.validate.outputs.linux_rpm_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name apl-redos-rpm-ubuntu-22.04 \
            --dir release-rpm
          source_rpm="$(find release-rpm -type f -name 'arvectum-proxy-launcher-*.redos8.x86_64.rpm' -print -quit)"
          test -n "$source_rpm"
          test "$(rpm -qp --qf '%{NAME}' "$source_rpm")" = "arvectum-proxy-launcher"
          test "$(rpm -qp --qf '%{VERSION}' "$source_rpm")" = "${{ needs.validate.outputs.version }}"
          test "$(rpm -qp --qf '%{ARCH}' "$source_rpm")" = "x86_64"
          cp "$source_rpm" "release-stage/${{ needs.validate.outputs.linux_rpm_name }}"

      - name: Download exact-main Linux AppImage artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-appimage
          gh run download "${{ needs.validate.outputs.linux_appimage_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name apl-lnx-008-appimage \
            --dir release-appimage
          source_appimage="$(find release-appimage -type f -name '*.AppImage' -print -quit)"
          test -n "$source_appimage"
          test -x "$source_appimage"
          file "$source_appimage" | grep -q ELF
          test "$(basename "$source_appimage")" = "${{ needs.validate.outputs.linux_appimage_name }}"
          cp "$source_appimage" "release-stage/${{ needs.validate.outputs.linux_appimage_name }}"

      - name: Download exact-main macOS beta DMGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-macos-arm64 release-macos-x64
          gh run download "${{ needs.validate.outputs.macos_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name apl-mac-package-macos-15 \
            --dir release-macos-arm64
          gh run download "${{ needs.validate.outputs.macos_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name apl-mac-package-macos-15-intel \
            --dir release-macos-x64
          source_arm="$(find release-macos-arm64 -type f -name '*-arm64.dmg' -print -quit)"
          source_x64="$(find release-macos-x64 -type f -name '*-x86_64.dmg' -print -quit)"
          test -n "$source_arm"
          test -n "$source_x64"
          test -s "$source_arm"
          test -s "$source_x64"
          cp "$source_arm" "release-stage/${{ needs.validate.outputs.macos_arm_name }}"
          cp "$source_x64" "release-stage/${{ needs.validate.outputs.macos_x64_name }}"

      - name: Verify artifact package and calculate public SHA256SUMS
        run: |
          set -euo pipefail
          ZIP_NAME="${{ needs.validate.outputs.zip_name }}"
          SETUP_NAME="${{ needs.validate.outputs.setup_name }}"
          LINUX_DEB_NAME="${{ needs.validate.outputs.linux_deb_name }}"
          LINUX_RPM_NAME="${{ needs.validate.outputs.linux_rpm_name }}"
          LINUX_APPIMAGE_NAME="${{ needs.validate.outputs.linux_appimage_name }}"
          MACOS_ARM_NAME="${{ needs.validate.outputs.macos_arm_name }}"
          MACOS_X64_NAME="${{ needs.validate.outputs.macos_x64_name }}"
          if [ ! -f "release-stage/${ZIP_NAME}" ]; then
            echo "::error::Expected release package 'release-stage/${ZIP_NAME}' not found"
            ls -la release-stage/
            exit 1
          fi
          SETUP_PATH="$(find release-stage -type f -name "$SETUP_NAME" -print -quit)"
          if [ -z "$SETUP_PATH" ]; then
            echo "::error::Expected release installer '$SETUP_NAME' not found under release-stage"
            find release-stage -maxdepth 3 -type f -print
            exit 1
          fi
          if [ "$SETUP_PATH" != "release-stage/${SETUP_NAME}" ]; then
            cp "$SETUP_PATH" "release-stage/${SETUP_NAME}"
          fi
          if [ ! -f "release-stage/${LINUX_DEB_NAME}" ]; then
            echo "::error::Expected Astra/Linux package 'release-stage/${LINUX_DEB_NAME}' not found"
            exit 1
          fi
          if [ ! -f "release-stage/${LINUX_RPM_NAME}" ]; then
            echo "::error::Expected RED OS RPM 'release-stage/${LINUX_RPM_NAME}' not found"
            exit 1
          fi
          if [ ! -f "release-stage/${LINUX_APPIMAGE_NAME}" ]; then
            echo "::error::Expected Linux AppImage 'release-stage/${LINUX_APPIMAGE_NAME}' not found"
            exit 1
          fi
          if [ ! -s "release-stage/${MACOS_ARM_NAME}" ]; then
            echo "::error::Expected macOS Apple Silicon beta DMG 'release-stage/${MACOS_ARM_NAME}' not found"
            exit 1
          fi
          if [ ! -s "release-stage/${MACOS_X64_NAME}" ]; then
            echo "::error::Expected macOS Intel beta DMG 'release-stage/${MACOS_X64_NAME}' not found"
            exit 1
          fi

          cd release-stage
          sha256sum "$ZIP_NAME" > SHA256SUMS.txt
          sha256sum "$SETUP_NAME" >> SHA256SUMS.txt
          sha256sum "$LINUX_DEB_NAME" >> SHA256SUMS.txt
          sha256sum "$LINUX_RPM_NAME" >> SHA256SUMS.txt
          sha256sum "$LINUX_APPIMAGE_NAME" >> SHA256SUMS.txt
          sha256sum "$MACOS_ARM_NAME" >> SHA256SUMS.txt
          sha256sum "$MACOS_X64_NAME" >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Guard against duplicate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.validate.outputs.expected_tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release '$TAG' already exists"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.validate.outputs.expected_tag }}"
          VERSION="${{ needs.validate.outputs.version }}"
          PRERELEASE="${{ needs.validate.outputs.prerelease }}"
          ZIP_NAME="${{ needs.validate.outputs.zip_name }}"
          SETUP_NAME="${{ needs.validate.outputs.setup_name }}"
          LINUX_DEB_NAME="${{ needs.validate.outputs.linux_deb_name }}"
          LINUX_RPM_NAME="${{ needs.validate.outputs.linux_rpm_name }}"
          LINUX_APPIMAGE_NAME="${{ needs.validate.outputs.linux_appimage_name }}"
          MACOS_ARM_NAME="${{ needs.validate.outputs.macos_arm_name }}"
          MACOS_X64_NAME="${{ needs.validate.outputs.macos_x64_name }}"

          EXTRA_FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA_FLAGS+=("--prerelease" "--latest=false")
          fi

          NOTES_ARGS=("--generate-notes")
          if [ -f "docs/releases/${VERSION}.md" ]; then
            NOTES_ARGS=("--notes-file" "docs/releases/${VERSION}.md")
          fi

          gh release create "$TAG" \
            "release-stage/${ZIP_NAME}" \
            "release-stage/${SETUP_NAME}" \
            "release-stage/${LINUX_DEB_NAME}" \
            "release-stage/${LINUX_RPM_NAME}" \
            "release-stage/${LINUX_APPIMAGE_NAME}" \
            "release-stage/${MACOS_ARM_NAME}" \
            "release-stage/${MACOS_X64_NAME}" \
            "release-stage/SHA256SUMS.txt" \
            --title "Arvectum Proxy Launcher ${VERSION}" \
            --verify-tag \
            "${NOTES_ARGS[@]}" \
            "${EXTRA_FLAGS[@]}"

  gitverse:
    name: Mirror release to GitVerse
    needs:
      - validate
      - publish
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.validate.outputs.should_publish == 'true'
    uses: ./.github/workflows/sync-release-to-gitverse.yml
    with:
      tag: ${{ needs.validate.outputs.expected_tag }}
    secrets: inherit
